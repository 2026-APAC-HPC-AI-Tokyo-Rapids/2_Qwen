# Execution is archived: jobs are disabled; preserve workflow history and logs.
name: Qwen制御処理の検証

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ false && (success()) }}
    runs-on: ubuntu-latest
    steps:
      - name: 検証対象を取得
        uses: actions/checkout@v7

      - name: uvを導入
        uses: astral-sh/setup-uv@v7

      - name: 有限kernel実験タグを検証
        env:
          QWEN_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: uv run --no-project python scripts/check-kernel-experiment-tags.py

      - name: 独立warpgroupの配置とtask割当を検証
        run: uv run --no-project python scripts/check-sm90-independent-wg.py

      - name: シェル構文を検証
        run: find scripts platforms containers aws submission -type f \( -name '*.sh' -o -name '*.pjm' -o -name '*.pbs' -o -name '*.slurm' -o -name '*.sbatch' \) -print0 | xargs -0 -r -n1 bash -n

      - name: YAML構文を検証
        run: uvx --from pyyaml python -c 'import pathlib, yaml; [yaml.safe_load(path.read_text()) for path in pathlib.Path(".github/workflows").glob("*.yml")]; [yaml.load(path.read_text(), Loader=yaml.BaseLoader) for path in pathlib.Path("aws").glob("*.yml")]'

      - name: GitHub Actions定義を検証
        run: uvx --from 'actionlint-py==1.7.12.24' actionlint

      - name: CloudFormation定義を検証
        run: uvx --from 'cfn-lint>=1.38,<2' cfn-lint aws/qwen-build-infrastructure.yml

      - name: コマンド行継続がないことを検証
        run: '! grep -RIn ''\\$'' scripts platforms containers aws .github/workflows'

      - name: 静的検査を実行
        run: uv run --project qwen-experiment-metrics ruff check qwen-experiment-metrics scripts containers

      - name: 単体テストを実行
        run: uv run --project qwen-experiment-metrics --with 'numpy>=1.26,<3' pytest -q qwen-experiment-metrics/tests

  gigatoken:
    if: ${{ false && (success()) }}
    name: gigatoken CPU互換性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 検証対象を取得
        uses: actions/checkout@v7

      - name: uvを導入
        uses: astral-sh/setup-uv@v7

      - name: 固定tokenizerのみ取得
        run: uvx --from huggingface_hub==0.36.0 hf download Qwen/Qwen3-235B-A22B-Instruct-2507 --revision ac9c66cc9b46af7306746a9250f23d47083d689e --include config.json generation_config.json merges.txt tokenizer.json tokenizer_config.json vocab.json --local-dir "${RUNNER_TEMP}/qwen-tokenizer"

      - name: コンテナ用patchからadapterを取り出す
        run: |
          mkdir -p "${RUNNER_TEMP}/gigatoken-source"
          git -C "${RUNNER_TEMP}/gigatoken-source" apply --include=python/sglang/srt/utils/hf_transformers/gigatoken_encoder.py "${GITHUB_WORKSPACE}/patches/sglang/gigatoken-encode.patch"

      - name: token IDとHF API互換性を検証
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run --no-project --python 3.12 --with gigatoken==0.10.0 --with transformers==5.12.1 --with tokenizers==0.22.2 --with jinja2==3.1.6 python scripts/check-gigatoken.py "${RUNNER_TEMP}/gigatoken-source" "${RUNNER_TEMP}/qwen-tokenizer" --adapter-only

      - name: 検証範囲を記録
        run: printf '### gigatoken CPU compatibility\n\nThe adapter parity check is CPU-only; GPU throughput and EAGLE acceptance are measured by the Genkai job.\n' >>"${GITHUB_STEP_SUMMARY}"

  pp4-gate:
    if: ${{ false && (success()) }}
    name: PP4 pre-allocation CPU gate regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 検証対象を取得
        uses: actions/checkout@v7

      - name: uvを導入
        uses: astral-sh/setup-uv@v7

      - name: SquashFS fixture用ツールを導入
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: 実CPU Torchでgateの失敗伝播を検証
        run: uv run --project qwen-experiment-metrics --python 3.12 --with torch==2.11.0+cpu --with numpy==2.2.6 --extra-index-url https://download.pytorch.org/whl/cpu pytest -q qwen-experiment-metrics/tests/test_pp4_cpu_gate.py
