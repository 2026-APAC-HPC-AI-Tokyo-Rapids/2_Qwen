name: AWSでQwen SquashFSを準備

on:
  workflow_call:
    inputs:
      require_build:
        required: true
        type: boolean
    outputs:
      genkai_container_sha256:
        value: ${{ (jobs.select-genkai.outputs.action == 'build' || jobs.select-aspire2ap.outputs.action == 'build' || jobs.select-firmus.outputs.action == 'build') && jobs.resolve.outputs.container_sha256 || jobs.select-genkai.outputs.container_sha256 }}
      genkai_container_size:
        value: ${{ (jobs.select-genkai.outputs.action == 'build' || jobs.select-aspire2ap.outputs.action == 'build' || jobs.select-firmus.outputs.action == 'build') && jobs.resolve.outputs.container_size || jobs.select-genkai.outputs.container_size }}
      aspire2ap_container_sha256:
        value: ${{ (jobs.select-genkai.outputs.action == 'build' || jobs.select-aspire2ap.outputs.action == 'build' || jobs.select-firmus.outputs.action == 'build') && jobs.resolve.outputs.container_sha256 || jobs.select-aspire2ap.outputs.container_sha256 }}
      aspire2ap_container_size:
        value: ${{ (jobs.select-genkai.outputs.action == 'build' || jobs.select-aspire2ap.outputs.action == 'build' || jobs.select-firmus.outputs.action == 'build') && jobs.resolve.outputs.container_size || jobs.select-aspire2ap.outputs.container_size }}
      firmus_container_sha256:
        value: ${{ (jobs.select-genkai.outputs.action == 'build' || jobs.select-aspire2ap.outputs.action == 'build' || jobs.select-firmus.outputs.action == 'build') && jobs.resolve.outputs.container_sha256 || jobs.select-firmus.outputs.container_sha256 }}
      firmus_container_size:
        value: ${{ (jobs.select-genkai.outputs.action == 'build' || jobs.select-aspire2ap.outputs.action == 'build' || jobs.select-firmus.outputs.action == 'build') && jobs.resolve.outputs.container_size || jobs.select-firmus.outputs.container_size }}

permissions:
  actions: read
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  CONTAINER_BUCKET: ${{ vars.QWEN_CONTAINER_BUCKET }}

jobs:
  select-genkai:
    name: 玄界のローカル成果物を選択
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    continue-on-error: true
    outputs:
      action: ${{ steps.select.outputs.action }}
      container_sha256: ${{ steps.select.outputs.container_sha256 }}
      container_size: ${{ steps.select.outputs.container_size }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
    defaults:
      run:
        shell: genkai-shell --github-shell {0}
    steps:
      - name: リポジトリ履歴を取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 既存成果物の再利用または新規ビルドを選択
        id: select
        env:
          CONTAINER_ARCHIVE_DIR: /home/pj26000080/share/sglang-containers
          GH_TOKEN: ${{ github.token }}
          REQUIRE_BUILD: ${{ inputs.require_build }}
        run: scripts/select-qwen-container.sh

  select-aspire2ap:
    name: ASPIRE 2A+のローカル成果物を選択
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    continue-on-error: true
    outputs:
      action: ${{ steps.select.outputs.action }}
      container_sha256: ${{ steps.select.outputs.container_sha256 }}
      container_size: ${{ steps.select.outputs.container_size }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
    defaults:
      run:
        shell: aspire2p-shell --github-shell {0}
    steps:
      - name: リポジトリ履歴を取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ASPIRE 2A+内の既存成果物を選択
        id: select
        env:
          CONTAINER_ARCHIVE_DIR: /scratch/users/industry/ai-hpc/apacsc14/sglang-containers
          GH_TOKEN: ${{ github.token }}
          REQUIRE_BUILD: ${{ inputs.require_build }}
        run: scripts/select-qwen-container.sh

  select-firmus:
    name: Firmusのローカル成果物を選択
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    continue-on-error: true
    outputs:
      action: ${{ steps.select.outputs.action }}
      container_sha256: ${{ steps.select.outputs.container_sha256 }}
      container_size: ${{ steps.select.outputs.container_size }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
    defaults:
      run:
        shell: firmus-shell --github-shell {0}
    steps:
      - name: リポジトリ履歴を取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Firmus内の既存成果物を選択
        id: select
        env:
          CONTAINER_ARCHIVE_DIR: /scratch/home/apacsc14/qwen/containers
          GH_TOKEN: ${{ github.token }}
          REQUIRE_BUILD: ${{ inputs.require_build }}
        run: scripts/select-qwen-container.sh

  stage:
    name: 管理済みSGLang mirrorから入力を準備
    needs: [select-genkai, select-aspire2ap, select-firmus]
    if: needs.select-genkai.outputs.action == 'build' || needs.select-aspire2ap.outputs.action == 'build' || needs.select-firmus.outputs.action == 'build'
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 60
    defaults:
      run:
        shell: genkai-shell --github-shell {0}
    steps:
      - name: Qwenのビルド入力を取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: AWSの一時資格情報を取得
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.QWEN_AWS_BUILD_ROLE_ARN }}

      - name: source mirrorを含む入力archiveをS3へ保存
        run: |
          input_root="$(mktemp -d "${RUNNER_TEMP}/qwen-build-input.XXXXXXXXXX")"
          install -d -m 0755 "${input_root}/git-mirror"
          cp -a "${GITHUB_WORKSPACE}" "${input_root}/qwen"
          rm -f -- "${input_root}/qwen/.env"
          git -C /fast/pj26000080/git-mirror/5_SGLang_Src.git fsck --no-dangling
          git clone --mirror /fast/pj26000080/git-mirror/5_SGLang_Src.git "${input_root}/git-mirror/5_SGLang_Src.git"
          tar -I 'zstd -3 -T0' -cf "${RUNNER_TEMP}/qwen-build-input.tar.zst" -C "${input_root}" qwen git-mirror
          rm -rf -- "${input_root:?}"
          uvx --from 'boto3>=1.40,<2' python scripts/s3-object-transfer.py upload "${RUNNER_TEMP}/qwen-build-input.tar.zst" "${CONTAINER_BUCKET}" "inputs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/qwen-build-input.tar.zst"

  build:
    name: 一時EC2でSquashFSをビルド
    needs: [select-genkai, select-aspire2ap, select-firmus, stage]
    if: needs.stage.result == 'success'
    uses: ./.github/workflows/aws-image-build.yml
    secrets: inherit

  resolve:
    name: S3成果物を確定
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      container_key: ${{ steps.resolve.outputs.container_key }}
      container_sha256: ${{ steps.resolve.outputs.container_sha256 }}
      container_size: ${{ steps.resolve.outputs.container_size }}
      sidecar_key: ${{ steps.resolve.outputs.sidecar_key }}
    steps:
      - name: AWSの一時資格情報を取得
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.QWEN_AWS_BUILD_ROLE_ARN }}

      - name: size、SHA-256、来歴を検証
        id: resolve
        env:
          BUILD_CONTAINER_KEY: ${{ needs.build.outputs.container_key }}
          BUILD_SIDECAR_KEY: ${{ needs.build.outputs.sidecar_key }}
        run: |
          container_key=${BUILD_CONTAINER_KEY}
          sidecar_key=${BUILD_SIDECAR_KEY}
          sidecar="$(aws s3 cp "s3://${CONTAINER_BUCKET}/${sidecar_key}" - --only-show-errors)"
          container_size="$(jq -er 'select(.schema_version == "container-sidecar/v1") | .container_artifact.size_bytes' <<<"${sidecar}")"
          container_sha256="$(jq -er '.container_artifact.sha256 | select(test("^[0-9a-f]{64}$"))' <<<"${sidecar}")"
          image_head="$(aws s3api head-object --region "${AWS_REGION}" --bucket "${CONTAINER_BUCKET}" --key "${container_key}")"
          [[ "$(jq -er '.ContentLength' <<<"${image_head}")" == "${container_size}" && "$(jq -er '.Metadata.sha256' <<<"${image_head}")" == "${container_sha256}" ]]
          printf 'container_key=%s\ncontainer_sha256=%s\ncontainer_size=%s\nsidecar_key=%s\n' "${container_key}" "${container_sha256}" "${container_size}" "${sidecar_key}" >>"${GITHUB_OUTPUT}"

  materialize:
    name: ${{ matrix.cluster }}のローカルarchiveへ確定
    needs: [select-genkai, select-aspire2ap, select-firmus, resolve]
    if: ${{ always() }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - cluster: 玄界
            remote_shell: genkai-shell
            archive_dir: /home/pj26000080/share/sglang-containers
            action: ${{ (needs.select-genkai.outputs.action == 'build' || needs.select-aspire2ap.outputs.action == 'build' || needs.select-firmus.outputs.action == 'build') && 'build' || needs.select-genkai.outputs.action }}
            source_run_id: ${{ needs.select-genkai.outputs.source_run_id }}
          - cluster: ASPIRE 2A+
            remote_shell: aspire2p-shell
            archive_dir: /scratch/users/industry/ai-hpc/apacsc14/sglang-containers
            action: ${{ (needs.select-genkai.outputs.action == 'build' || needs.select-aspire2ap.outputs.action == 'build' || needs.select-firmus.outputs.action == 'build') && 'build' || needs.select-aspire2ap.outputs.action }}
            source_run_id: ${{ needs.select-aspire2ap.outputs.source_run_id }}
          - cluster: Firmus
            remote_shell: firmus-shell
            archive_dir: /scratch/home/apacsc14/qwen/containers
            action: ${{ (needs.select-genkai.outputs.action == 'build' || needs.select-aspire2ap.outputs.action == 'build' || needs.select-firmus.outputs.action == 'build') && 'build' || needs.select-firmus.outputs.action }}
            source_run_id: ${{ needs.select-firmus.outputs.source_run_id }}
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    defaults:
      run:
        shell: ${{ matrix.remote_shell }} --github-shell {0}
    steps:
      - name: archive処理を取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: AWSの一時資格情報を取得
        if: matrix.action == 'build'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.QWEN_AWS_BUILD_ROLE_ARN }}

      - name: build時はS3から取得し、再利用時はarchive内でハードリンク
        if: matrix.action == 'reuse' || (matrix.action == 'build' && needs.resolve.result == 'success')
        env:
          ACTION: ${{ matrix.action }}
          CONTAINER_ARCHIVE_DIR: ${{ matrix.archive_dir }}
          CONTAINER_KEY: ${{ needs.resolve.outputs.container_key }}
          CONTAINER_SHA256: ${{ needs.resolve.outputs.container_sha256 }}
          CONTAINER_SIZE: ${{ needs.resolve.outputs.container_size }}
          SIDECAR_KEY: ${{ needs.resolve.outputs.sidecar_key }}
          SOURCE_RUN_ID: ${{ matrix.source_run_id }}
        run: scripts/materialize-qwen-container.sh
