name: FirmusでQwen3 PDを実行

on:
  workflow_call:
    inputs:
      config_path:
        required: false
        default: configs/firmus-framework.json
        type: string
      node_count:
        required: true
        type: string
      profile:
        required: true
        type: boolean
      require_build:
        required: true
        type: boolean
      dynamo:
        required: false
        default: false
        type: boolean
      container_sha256:
        required: false
        default: ''
        type: string
      container_size:
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

env:
  RUNTIME_ROOT: /scratch/home/ACCOUNT/qwen/runs

defaults:
  run:
    shell: firmus-shell --github-shell {0}

jobs:
  provision:
    name: 固定したイメージ・モデル・実行条件を配備
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    outputs:
      runtime_dir: ${{ steps.provision.outputs.runtime_dir }}
    steps:
      - name: 2ノードを検証
        shell: bash
        run: "test '${{ inputs.node_count }}' = 2"

      - name: 実行用ファイルを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: SquashFS・モデル・tokenizer・設定を配備
        id: provision
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          REQUIRE_BUILD: ${{ inputs.require_build }}
          CONTAINER_SHA256: ${{ inputs.container_sha256 }}
          CONTAINER_SIZE: ${{ inputs.container_size }}
          FIRMUS_CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          if [[ '${{ inputs.dynamo }}' == true ]]; then provision=scripts/provision-firmus-dynamo.sh; else provision=scripts/provision-firmus-framework.sh; fi
          stderr=$(mktemp)
          provision_wrapper=$(mktemp)
          printf '#!/usr/bin/env bash\nexec bash %q %q\n' "${provision}" "${FIRMUS_CONFIG_PATH}" >"${provision_wrapper}"
          trap 'rm -f -- "${stderr}" "${provision_wrapper}"' EXIT
          deadline=$((SECONDS + 900))
          while true; do
            if timeout --foreground 600 firmus-shell --github-shell "${provision_wrapper}" 2>"${stderr}"; then cat "${stderr}" >&2; break; else status=$?; fi
            cat "${stderr}" >&2
            if [[ "${status}" -eq 2 || "${status}" -eq 254 ]] && grep -Eq '^(Connection closed by .* port [0-9]+|exec request failed on channel [0-9]+|.*: fork: (retry: )?Resource temporarily unavailable)[[:space:]]*$' "${stderr}"; then status=255; fi
            if [[ "${status}" -ne 255 && "${status}" -ne 124 ]] || (( SECONDS >= deadline )); then exit "${status}"; fi
            printf 'Firmus preparation unavailable (exit %s); retry in 30s. No Slurm submission in this stage.\n' "${status}"
            sleep 30
          done

      - name: 配備失敗時の実行環境を削除
        if: (failure() || cancelled()) && steps.provision.outputs.runtime_dir != ''
        env:
          RUNTIME_DIR: ${{ steps.provision.outputs.runtime_dir }}
        run: rm -rf -- "${RUNTIME_DIR:?}"

  run:
    name: 2ノード16 GPUでPDとAIPerfを実行
    needs: provision
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    env:
      MODEL_PATH: /scratch/models/Qwen3-235B-A22B-Instruct-2507-FP8
      PROFILE: ${{ inputs.profile }}
      RUNTIME_DIR: ${{ needs.provision.outputs.runtime_dir }}
    steps:
      - name: 接続待ち処理を取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Slurmジョブを投入
        id: submit
        env:
          DYNAMO: ${{ inputs.dynamo }}
        run: |
          cd "${RUNTIME_DIR}"
          if [[ "${DYNAMO}" != true ]]; then
            pp_size="$(jq -er '.prefill.pp // 1' source/firmus-framework.json)"
            if [[ "${pp_size}" == 4 ]]; then
              image_sha="$(jq -er .images.sglang.sha256 source/firmus-framework.json)"
              jq -e --arg sha "${image_sha}" '.schema == "pp4-cpu-gate/v1" and .result == "pass" and .image_sha256 == $sha' source/pp4-cpu-gate.json >/dev/null
            fi
          fi
          job_id="$(sbatch --parsable --export=ALL --output="${RUNTIME_DIR}/logs/slurm-%j.log" --error="${RUNTIME_DIR}/logs/slurm-%j.stderr.log" --job-name=qwen3_pd "${RUNTIME_DIR}/scripts/submit.sbatch")"
          [[ "${job_id}" =~ ^[0-9]+$ ]]
          printf 'SLURM_JOB_ID=%s\n' "${job_id}" >>"${GITHUB_ENV}"
          printf 'job_id=%s\n' "${job_id}" >>"${GITHUB_OUTPUT}"

      - name: Slurmジョブの終了と比較成果物を確認
        shell: bash
        run: scripts/monitor-qwen-job.sh firmus-shell platforms/firmus/check-qwen-job.sh

      - name: 中断時は自分のSlurmジョブだけ停止して終了を待つ
        id: terminal
        if: always() && steps.submit.outputs.job_id != ''
        env:
          OWN_JOB_ID: ${{ steps.submit.outputs.job_id }}
          CANCEL_JOB: ${{ job.status != 'success' }}
        run: |
          [[ "${OWN_JOB_ID}" =~ ^[0-9]+$ ]]
          if [[ "${CANCEL_JOB}" == true ]]; then scancel "${OWN_JOB_ID}" || printf 'scancel failed for job %s; checking terminal state.\n' "${OWN_JOB_ID}" >&2; fi
          for attempt in {1..24}; do
            state="$(sacct --allocations --jobs="${OWN_JOB_ID}" --noheader --parsable2 --format=JobID,State | awk -F'|' -v id="${OWN_JOB_ID}" '$1 == id {print $2}')"
            case "${state}" in COMPLETED|FAILED|TIMEOUT|CANCELLED*|OUT_OF_MEMORY|NODE_FAIL|PREEMPTED|BOOT_FAIL|DEADLINE) exit 0;; esac
            sleep 5
          done
          printf 'Slurm job %s has not reached terminal state (%s); preserving runtime.\n' "${OWN_JOB_ID}" "${state}" >&2
          exit 1

      - name: ログ・AIPerf・profile・来歴をrunnerへ回収
        id: collect
        if: always() && steps.terminal.outcome == 'success'
        shell: home-lab-shell {0}
        run: |
          destination="${RUNNER_TEMP}/qwen-firmus-pd"
          install -d -m 0755 "${destination}"
          # A disconnected SSH tar stream previously lost source/ after a successful run.
          # Retry only artifact reads; never repeat the separate sbatch step.
          retry_read() {
            local attempt status
            for attempt in 1 2 3 4 5 6; do
              if timeout --foreground "${read_timeout}" "$@"; then return 0; else status=$?; fi
              if (( attempt == 6 )); then return "${status}"; fi
              printf 'Artifact read failed (exit %s); retry in 30s (%s/6).\n' "${status}" "${attempt}" >&2
              sleep 30
            done
          }
          # A 950 MiB Nsight profile exceeded 180 seconds (a54355a); other reads keep the old bound.
          for part in logs profile results source; do
            if [[ "${part}" == profile ]]; then read_timeout=900; else read_timeout=180; fi
            retry_read firmus-shell --pull "${RUNTIME_DIR}/${part}" "${destination}/${part}"
          done
          read_timeout=180
          marker=$(retry_read firmus-shell "if test -e '${RUNTIME_DIR}/run-success'; then echo present; else echo absent; fi")
          if [[ "${marker}" == present ]]; then retry_read firmus-shell --pull "${RUNTIME_DIR}/run-success" "${destination}/run-success"; else [[ "${marker}" == absent ]]; fi

      - name: 実行成果物を保存
        id: upload
        if: always() && steps.terminal.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: qwen-firmus-pd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-firmus-pd
          retention-days: 1
          if-no-files-found: error

      - name: Summary用のuvを導入
        if: always() && steps.submit.outputs.job_id != ''
        uses: astral-sh/setup-uv@v7

      - name: GPU終了後に回収した実設定を検証
        if: always() && steps.collect.outcome == 'success' && !inputs.dynamo
        shell: bash
        run: |
          root="${RUNNER_TEMP}/qwen-firmus-pd"
          config="${root}/source/source/firmus-framework.json"
          if [[ "$(jq -er .framework "${config}")" == sglang ]]; then
            for worker in prefill-0 prefill-1 prefill-2 decode-0; do uv run --no-project --python 3.13 python scripts/check-firmus-server-info.py "${config}" "${root}/results/results/server-info-${worker}.json" "${worker%%-*}"; done
          fi

      - name: 実行条件・結果・Nsight成果物をsummaryに記録
        if: always() && steps.submit.outputs.job_id != ''
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: uv run --no-project --python 3.13 python scripts/summarize-firmus-run.py "${RUNNER_TEMP}/qwen-firmus-pd" --job-id "${SLURM_JOB_ID}" --status "${JOB_STATUS}" >>"${GITHUB_STEP_SUMMARY}"

      - name: 回収済みで終了した実行環境を削除
        if: always() && steps.collect.outcome == 'success' && steps.upload.outcome == 'success'
        run: |
          state="$(sacct --allocations --jobs="${SLURM_JOB_ID}" --noheader --parsable2 --format=JobID,State | awk -F'|' -v id="${SLURM_JOB_ID}" '$1 == id {print $2}')"
          case "${state}" in COMPLETED|FAILED|TIMEOUT|CANCELLED*|OUT_OF_MEMORY|NODE_FAIL) rm -rf -- "${RUNTIME_DIR:?}";; *) printf 'Preserving runtime and Slurm job %s (state=%s)\n' "${SLURM_JOB_ID}" "${state}";; esac
