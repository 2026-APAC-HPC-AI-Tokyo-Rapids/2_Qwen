name: FirmusでQwen3 PDを実行

on:
  workflow_call:
    inputs:
      node_count:
        required: true
        type: string
      profile:
        required: true
        type: boolean
      require_build:
        required: true
        type: boolean
      dynamo:
        required: false
        default: false
        type: boolean
      container_sha256:
        required: false
        default: ''
        type: string
      container_size:
        required: false
        default: ''
        type: string
      recovery_job_id:
        required: false
        default: ''
        type: string
      recovery_runtime_dir:
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

env:
  RUNTIME_ROOT: /scratch/home/ACCOUNT/qwen/runs

defaults:
  run:
    shell: firmus-shell --github-shell {0}

jobs:
  provision:
    name: Reference baseline実行環境を配備
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    outputs:
      runtime_dir: ${{ steps.provision.outputs.runtime_dir }}
    steps:
      - name: 2ノードを検証
        run: "test '${{ inputs.node_count }}' = 2"

      - name: 実行用ファイルを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: SquashFS・モデル・tokenizer・設定を配備
        id: provision
        env:
          PROFILE: ${{ inputs.profile }}
          REQUIRE_BUILD: ${{ inputs.require_build }}
          CONTAINER_SHA256: ${{ inputs.container_sha256 }}
          CONTAINER_SIZE: ${{ inputs.container_size }}
          RECOVERY_RUNTIME_DIR: ${{ inputs.recovery_runtime_dir }}
        run: |
          if [[ -n "${RECOVERY_RUNTIME_DIR}" ]]; then
            [[ "${RECOVERY_RUNTIME_DIR}" == "${RUNTIME_ROOT}/dynamo-"* && -s "${RECOVERY_RUNTIME_DIR}/source/provenance.json" ]]
            printf 'runtime_dir=%s\n' "${RECOVERY_RUNTIME_DIR}" >>"${GITHUB_OUTPUT}"
          elif [[ '${{ inputs.dynamo }}' == true ]]; then scripts/provision-firmus-dynamo.sh; else scripts/provision-firmus-framework.sh; fi

      - name: 配備失敗時の実行環境を削除
        if: failure() && steps.provision.outputs.runtime_dir != '' && inputs.recovery_runtime_dir == ''
        env:
          RUNTIME_DIR: ${{ steps.provision.outputs.runtime_dir }}
        run: rm -rf -- "${RUNTIME_DIR:?}"

  run:
    name: 2ノード16 GPUでPDとAIPerfを実行
    needs: provision
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    env:
      MODEL_PATH: /scratch/models/Qwen3-235B-A22B-Instruct-2507-FP8
      PROFILE: ${{ inputs.profile }}
      RUNTIME_DIR: ${{ needs.provision.outputs.runtime_dir }}
    steps:
      - name: 接続待ち処理を取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Slurmジョブを投入
        id: submit
        env:
          RECOVERY_JOB_ID: ${{ inputs.recovery_job_id }}
        run: |
          cd "${RUNTIME_DIR}"
          if [[ -n "${RECOVERY_JOB_ID}" ]]; then
            job_id=${RECOVERY_JOB_ID}
            [[ "${job_id}" =~ ^[0-9]+$ ]]
            scontrol show job "${job_id}" >"${RUNTIME_DIR}/logs/slurm-before-recovery.txt"
            grep -Fq "WorkDir=${RUNTIME_DIR}" "${RUNTIME_DIR}/logs/slurm-before-recovery.txt"
            grep -Fq 'JobState=PENDING' "${RUNTIME_DIR}/logs/slurm-before-recovery.txt"
            scontrol update "JobId=${job_id}" TimeLimit=00:17:00
            scontrol show job "${job_id}" >"${RUNTIME_DIR}/logs/slurm-after-recovery.txt"
            jq -n --arg run "${GITHUB_RUN_ID}" --arg commit "${GITHUB_SHA}" --arg job "${job_id}" '{recovery_workflow_run_id:$run,recovery_commit:$commit,slurm_job_id:$job,time_limit:"00:17:00",new_job_submitted:false}' >"${RUNTIME_DIR}/source/recovery.json"
          else
            job_id="$(sbatch --parsable --export=ALL --output="${RUNTIME_DIR}/logs/slurm-%j.log" --error="${RUNTIME_DIR}/logs/slurm-%j.stderr.log" --job-name=qwen3_pd "${RUNTIME_DIR}/scripts/submit.sbatch")"
          fi
          [[ "${job_id}" =~ ^[0-9]+$ ]]
          printf 'SLURM_JOB_ID=%s\n' "${job_id}" >>"${GITHUB_ENV}"
          printf 'job_id=%s\n' "${job_id}" >>"${GITHUB_OUTPUT}"

      - name: Slurmジョブの終了と比較成果物を確認
        shell: bash
        run: scripts/monitor-qwen-job.sh firmus-shell platforms/firmus/check-qwen-job.sh

      - name: ログ・AIPerf・profile・来歴をrunnerへ回収
        id: collect
        if: always() && steps.submit.outputs.job_id != ''
        shell: home-lab-shell {0}
        run: |
          destination="${RUNNER_TEMP}/qwen-firmus-pd"
          install -d -m 0755 "${destination}"
          firmus-shell --pull "${RUNTIME_DIR}/logs" "${destination}/logs"
          firmus-shell --pull "${RUNTIME_DIR}/profile" "${destination}/profile"
          firmus-shell --pull "${RUNTIME_DIR}/results" "${destination}/results"
          firmus-shell --pull "${RUNTIME_DIR}/source" "${destination}/source"
          if firmus-shell "test -e '${RUNTIME_DIR}/run-success'"; then firmus-shell --pull "${RUNTIME_DIR}/run-success" "${destination}/run-success"; fi

      - name: 実行成果物を保存
        id: upload
        if: always() && steps.submit.outputs.job_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: qwen-firmus-pd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-firmus-pd
          if-no-files-found: error

      - name: Summary用のuvを導入
        if: always() && steps.submit.outputs.job_id != ''
        uses: astral-sh/setup-uv@v7

      - name: 実行条件・結果・Nsight成果物をsummaryに記録
        if: always() && steps.submit.outputs.job_id != ''
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: uv run --no-project --python 3.13 python scripts/summarize-firmus-run.py "${RUNNER_TEMP}/qwen-firmus-pd" --job-id "${SLURM_JOB_ID}" --status "${JOB_STATUS}" >>"${GITHUB_STEP_SUMMARY}"

      - name: 回収済みで終了した実行環境を削除
        if: always() && steps.collect.outcome == 'success' && steps.upload.outcome == 'success'
        run: |
          state="$(sacct --allocations --jobs="${SLURM_JOB_ID}" --noheader --parsable2 --format=JobID,State | awk -F'|' -v id="${SLURM_JOB_ID}" '$1 == id {print $2}')"
          case "${state}" in COMPLETED|FAILED|TIMEOUT|CANCELLED*|OUT_OF_MEMORY|NODE_FAIL) rm -rf -- "${RUNTIME_DIR:?}";; *) printf 'Preserving runtime and Slurm job %s (state=%s)\n' "${SLURM_JOB_ID}" "${state}";; esac
