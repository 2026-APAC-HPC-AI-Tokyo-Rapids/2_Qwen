name: FirmusでQwen3 PDを実行

on:
  workflow_call:
    inputs:
      node_count:
        required: true
        type: string
      profile:
        required: true
        type: boolean
      require_build:
        required: true
        type: boolean
      megamoe_gate:
        required: false
        default: false
        type: boolean
      dynamo:
        required: false
        default: false
        type: boolean
      container_sha256:
        required: false
        default: ''
        type: string
      container_size:
        required: false
        default: ''
        type: string
      recovery_job_id:
        required: false
        default: ''
        type: string
      recovery_runtime_dir:
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

env:
  RUNTIME_ROOT: /scratch/home/ACCOUNT/qwen/runs

defaults:
  run:
    shell: firmus-shell --github-shell {0}

jobs:
  provision:
    name: 固定したイメージ・モデル・実行条件を配備
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    outputs:
      runtime_dir: ${{ steps.recover-runtime.outputs.runtime_dir || steps.provision.outputs.runtime_dir }}
    steps:
      - name: 要求ノード数を検証
        shell: bash
        run: "if [[ '${{ inputs.megamoe_gate }}' == true ]]; then test '${{ inputs.node_count }}' = 1; else test '${{ inputs.node_count }}' = 2; fi"

      - name: 実行用ファイルを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 既存の実行環境を指定
        id: recover-runtime
        if: inputs.recovery_runtime_dir != ''
        shell: bash
        env:
          RECOVERY_RUNTIME_DIR: ${{ inputs.recovery_runtime_dir }}
        run: |
          [[ "${RECOVERY_RUNTIME_DIR}" == "${RUNTIME_ROOT}/dynamo-"* ]]
          printf 'runtime_dir=%s\n' "${RECOVERY_RUNTIME_DIR}" >>"${GITHUB_OUTPUT}"

      - name: SquashFS・モデル・tokenizer・設定を配備
        id: provision
        if: inputs.recovery_runtime_dir == ''
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          REQUIRE_BUILD: ${{ inputs.require_build }}
          CONTAINER_SHA256: ${{ inputs.container_sha256 }}
          CONTAINER_SIZE: ${{ inputs.container_size }}
        run: |
          if [[ '${{ inputs.megamoe_gate }}' == true ]]; then provision=scripts/provision-firmus-megamoe-gate.sh; elif [[ '${{ inputs.dynamo }}' == true ]]; then provision=scripts/provision-firmus-dynamo.sh; else provision=scripts/provision-firmus-framework.sh; fi
          stderr=$(mktemp)
          trap 'rm -f -- "${stderr}"' EXIT
          deadline=$((SECONDS + 900))
          while true; do
            if timeout --foreground 600 firmus-shell --github-shell "${provision}" 2>"${stderr}"; then cat "${stderr}" >&2; break; else status=$?; fi
            cat "${stderr}" >&2
            if [[ "${status}" -eq 2 || "${status}" -eq 254 ]] && grep -Eq '^(Connection closed by .* port [0-9]+|exec request failed on channel [0-9]+|.*: fork: (retry: )?Resource temporarily unavailable)[[:space:]]*$' "${stderr}"; then status=255; fi
            if [[ "${status}" -ne 255 && "${status}" -ne 124 ]] || (( SECONDS >= deadline )); then exit "${status}"; fi
            printf 'Firmus preparation unavailable (exit %s); retry in 30s. No Slurm submission in this stage.\n' "${status}"
            sleep 30
          done

      - name: 配備失敗時の実行環境を削除
        if: failure() && steps.provision.outputs.runtime_dir != '' && inputs.recovery_runtime_dir == ''
        env:
          RUNTIME_DIR: ${{ steps.provision.outputs.runtime_dir }}
        run: rm -rf -- "${RUNTIME_DIR:?}"

  run:
    name: ${{ inputs.megamoe_gate && '4 H200で有限MegaMoE gateを実行' || '2ノード16 GPUでPDとAIPerfを実行' }}
    needs: provision
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    env:
      MODEL_PATH: /scratch/models/Qwen3-235B-A22B-Instruct-2507-FP8
      PROFILE: ${{ inputs.profile }}
      RUNTIME_DIR: ${{ needs.provision.outputs.runtime_dir }}
    steps:
      - name: 接続待ち処理を取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Slurmジョブを投入
        id: submit
        if: inputs.recovery_job_id == ''
        run: |
          cd "${RUNTIME_DIR}"
          export_mode=ALL
          if [[ '${{ inputs.megamoe_gate }}' == true ]]; then export_mode=NONE; fi
          job_id="$(sbatch --parsable --export="${export_mode}" --output="${RUNTIME_DIR}/logs/slurm-%j.log" --error="${RUNTIME_DIR}/logs/slurm-%j.stderr.log" --job-name=run "${RUNTIME_DIR}/scripts/submit.sbatch")"
          [[ "${job_id}" =~ ^[0-9]+$ ]]
          printf 'SLURM_JOB_ID=%s\n' "${job_id}" >>"${GITHUB_ENV}"
          printf 'job_id=%s\n' "${job_id}" >>"${GITHUB_OUTPUT}"

      - name: SSHの復帰を待って既存Slurmジョブを復旧
        id: recover
        if: inputs.recovery_job_id != ''
        shell: bash
        env:
          RECOVERY_JOB_ID: ${{ inputs.recovery_job_id }}
        run: |
          stderr=$(mktemp)
          trap 'rm -f -- "${stderr}"' EXIT
          deadline=$((SECONDS + 600))
          while true; do
            if timeout --foreground 180 firmus-shell --github-shell platforms/firmus/recover-dynamo-job.sh 2>"${stderr}"; then break; else status=$?; fi
            cat "${stderr}" >&2
            if [[ "${status}" -eq 2 ]] && grep -Eq '^(Connection closed by .* port [0-9]+|exec request failed on channel [0-9]+)$' "${stderr}"; then status=255; fi
            if [[ "${status}" -ne 255 && "${status}" -ne 124 ]] || (( SECONDS >= deadline )); then printf 'Existing Slurm job %s was preserved; recovery failed (exit %s). Inspect SSH and recovery logs.\n' "${RECOVERY_JOB_ID}" "${status}" >>"${GITHUB_STEP_SUMMARY}"; exit "${status}"; fi
            printf 'Recovery SSH unavailable (exit %s); retry in 30s; no new Slurm job.\n' "${status}"
            sleep 30
          done
          printf 'SLURM_JOB_ID=%s\n' "${RECOVERY_JOB_ID}" >>"${GITHUB_ENV}"
          printf 'job_id=%s\n' "${RECOVERY_JOB_ID}" >>"${GITHUB_OUTPUT}"

      - name: Slurmジョブの終了と比較成果物を確認
        shell: bash
        run: |
          if [[ '${{ inputs.megamoe_gate }}' == true ]]; then checker=platforms/firmus/check-megamoe-gate.sh; else checker=platforms/firmus/check-qwen-job.sh; fi
          scripts/monitor-qwen-job.sh firmus-shell "${checker}"

      - name: ログ・AIPerf・profile・来歴をrunnerへ回収
        id: collect
        if: always() && (steps.submit.outputs.job_id != '' || steps.recover.outputs.job_id != '')
        shell: home-lab-shell {0}
        run: |
          destination="${RUNNER_TEMP}/qwen-firmus-pd"
          install -d -m 0755 "${destination}"
          # A disconnected SSH tar stream previously lost source/ after a successful run.
          # Retry only artifact reads; never repeat the separate sbatch step.
          retry_read() {
            local attempt status
            for attempt in 1 2 3 4 5 6; do
              if timeout --foreground 180 "$@"; then return 0; else status=$?; fi
              if (( attempt == 6 )); then return "${status}"; fi
              printf 'Artifact read failed (exit %s); retry in 30s (%s/6).\n' "${status}" "${attempt}" >&2
              sleep 30
            done
          }
          for part in logs profile results source; do retry_read firmus-shell --pull "${RUNTIME_DIR}/${part}" "${destination}/${part}"; done
          marker=$(retry_read firmus-shell "if test -e '${RUNTIME_DIR}/run-success'; then echo present; else echo absent; fi")
          if [[ "${marker}" == present ]]; then retry_read firmus-shell --pull "${RUNTIME_DIR}/run-success" "${destination}/run-success"; else [[ "${marker}" == absent ]]; fi

      - name: 実行成果物を保存
        id: upload
        if: always() && (steps.submit.outputs.job_id != '' || steps.recover.outputs.job_id != '')
        uses: actions/upload-artifact@v7
        with:
          name: qwen-firmus-pd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-firmus-pd
          if-no-files-found: error

      - name: Summary用のuvを導入
        if: always() && (steps.submit.outputs.job_id != '' || steps.recover.outputs.job_id != '')
        uses: astral-sh/setup-uv@v7

      - name: 実行条件・結果・Nsight成果物をsummaryに記録
        if: always() && (steps.submit.outputs.job_id != '' || steps.recover.outputs.job_id != '')
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ '${{ inputs.megamoe_gate }}' == true ]]; then
            printf '### Four-H200 MegaMoE kernel gate\n\nSlurm %s; status **%s**. This is an actual-adapter numerical/graph correctness diagnostic, not an official benchmark. Inspect results/gate.json and logs/gpu-gate.log.\n' "${SLURM_JOB_ID}" "${JOB_STATUS}" >>"${GITHUB_STEP_SUMMARY}"
          else
            uv run --no-project --python 3.13 python scripts/summarize-firmus-run.py "${RUNNER_TEMP}/qwen-firmus-pd" --job-id "${SLURM_JOB_ID}" --status "${JOB_STATUS}" >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: 回収済みで終了した実行環境を削除
        if: always() && !inputs.megamoe_gate && steps.collect.outcome == 'success' && steps.upload.outcome == 'success'
        run: |
          state="$(sacct --allocations --jobs="${SLURM_JOB_ID}" --noheader --parsable2 --format=JobID,State | awk -F'|' -v id="${SLURM_JOB_ID}" '$1 == id {print $2}')"
          case "${state}" in COMPLETED|FAILED|TIMEOUT|CANCELLED*|OUT_OF_MEMORY|NODE_FAIL) rm -rf -- "${RUNTIME_DIR:?}";; *) printf 'Preserving runtime and Slurm job %s (state=%s)\n' "${SLURM_JOB_ID}" "${state}";; esac
