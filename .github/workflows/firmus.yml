name: FirmusでQwen3 PDを実行

on:
  workflow_call:
    inputs:
      node_count:
        required: true
        type: string
      profile:
        required: true
        type: boolean
      container_sha256:
        required: true
        type: string
      container_size:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  RUNTIME_ROOT: /scratch/home/apacsc14/qwen/runs

defaults:
  run:
    shell: firmus-shell --github-shell {0}

jobs:
  provision:
    name: 公式PD実行環境を配備
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    outputs:
      runtime_dir: ${{ steps.provision.outputs.runtime_dir }}
    steps:
      - name: 2ノードを検証
        run: "test '${{ inputs.node_count }}' = 2"

      - name: 実行用ファイルを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: SquashFS・モデル・tokenizer・設定を配備
        id: provision
        env:
          CONTAINER_ARCHIVE_DIR: /scratch/home/apacsc14/qwen/containers
          CONTAINER_SHA256: ${{ inputs.container_sha256 }}
          CONTAINER_SIZE: ${{ inputs.container_size }}
          ENROOT_LIBRARY_PATH: /scratch/home/apacsc14/.local/lib/enroot
          ENROOT_SYSCONF_PATH: /scratch/home/apacsc14/.local/etc/enroot
          MODEL_PATH: /scratch/models/Qwen3-235B-A22B-Instruct-2507-FP8
          PROFILE: ${{ inputs.profile }}
        run: PROVISION_OUTPUT="${GITHUB_OUTPUT}" scripts/provision-qwen-pd.sh

      - name: 配備失敗時の実行環境を削除
        if: failure() && steps.provision.outputs.runtime_dir != ''
        env:
          RUNTIME_DIR: ${{ steps.provision.outputs.runtime_dir }}
        run: rm -rf -- "${RUNTIME_DIR:?}"

  run:
    name: 2ノード16 GPUでPDとAIPerfを実行
    needs: provision
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    env:
      MODEL_PATH: /scratch/models/Qwen3-235B-A22B-Instruct-2507-FP8
      PROFILE: ${{ inputs.profile }}
      RUNTIME_DIR: ${{ needs.provision.outputs.runtime_dir }}
    steps:
      - name: Slurmジョブを投入
        id: submit
        run: |
          cd "${RUNTIME_DIR}"
          variables="ALL,CONTAINER_IMAGE=${RUNTIME_DIR}/sglang.sqsh,ENROOT_LIBRARY_PATH=${RUNTIME_DIR}/enroot-library,ENROOT_MOUNT_HOME=no,ENROOT_SYSCONF_PATH=${RUNTIME_DIR}/enroot-system,MODEL_PATH=${MODEL_PATH},OUTPUT_DIR=${RUNTIME_DIR},PROFILE=${PROFILE}"
          job_id="$(sbatch --parsable --export="${variables}" --output="${RUNTIME_DIR}/logs/slurm-%j.log" --job-name=qwen3_pd "${RUNTIME_DIR}/scripts/submit.sbatch")"
          [[ "${job_id}" =~ ^[0-9]+$ ]]
          printf 'SLURM_JOB_ID=%s\n' "${job_id}" >>"${GITHUB_ENV}"
          printf 'job_id=%s\n' "${job_id}" >>"${GITHUB_OUTPUT}"

      - name: Slurmジョブの終了と公式成果物を確認
        run: |
          while squeue --noheader --jobs="${SLURM_JOB_ID}" | grep -q .; do sleep 15; done
          sacct --allocations --jobs="${SLURM_JOB_ID}" --noheader --parsable2 --format=JobID,State,ExitCode,Elapsed,AllocNodes >"${RUNTIME_DIR}/logs/slurm-accounting.txt"
          cat "${RUNTIME_DIR}/logs/slurm-accounting.txt"
          cat "${RUNTIME_DIR}/logs/slurm-${SLURM_JOB_ID}.log"
          state="$(awk -F'|' -v job_id="${SLURM_JOB_ID}" '$1 == job_id {print $2}' "${RUNTIME_DIR}/logs/slurm-accounting.txt")"
          exit_code="$(awk -F'|' -v job_id="${SLURM_JOB_ID}" '$1 == job_id {print $3}' "${RUNTIME_DIR}/logs/slurm-accounting.txt")"
          test "${state}" = COMPLETED
          test "${exit_code}" = 0:0
          test -e "${RUNTIME_DIR}/run-success"
          test -s "${RUNTIME_DIR}/results/profile_export_aiperf.json"
          test -s "${RUNTIME_DIR}/results/score.json"

      - name: ログ・AIPerf・profile・来歴をrunnerへ回収
        if: always() && steps.submit.outputs.job_id != ''
        shell: home-lab-shell {0}
        run: |
          destination="${RUNNER_TEMP}/qwen-firmus-pd"
          install -d -m 0755 "${destination}"
          firmus-shell --pull "${RUNTIME_DIR}/logs" "${destination}/logs"
          firmus-shell --pull "${RUNTIME_DIR}/profile" "${destination}/profile"
          firmus-shell --pull "${RUNTIME_DIR}/results" "${destination}/results"
          firmus-shell --pull "${RUNTIME_DIR}/source" "${destination}/source"
          firmus-shell --pull "${RUNTIME_DIR}/run-success" "${destination}/run-success"

      - name: 実行成果物を保存
        if: always() && steps.submit.outputs.job_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: qwen-firmus-pd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-firmus-pd
          if-no-files-found: error

      - name: 実行環境と残留ジョブを削除
        if: always()
        run: if [[ -n "${SLURM_JOB_ID:-}" ]] && squeue --noheader --jobs="${SLURM_JOB_ID}" | grep -q .; then scancel "${SLURM_JOB_ID}"; fi; rm -rf -- "${RUNTIME_DIR:?}"
