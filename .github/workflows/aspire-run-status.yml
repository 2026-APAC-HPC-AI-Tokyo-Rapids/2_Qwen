name: Inspect approved ASPIRE run 38759737095
on:
  push:
    branches: [perf/aspire-megamoe-port]
    paths: [.github/workflows/aspire-run-status.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the existing PBS allocation and startup logs
        shell: aspire2p-shell --github-shell {0}
        run: |
          set -euo pipefail
          roots=(/scratch/users/industry/ai-hpc/ACCOUNT/sglang-runs/pd-38759737095-1.*)
          test "${#roots[@]}" = 1
          root=${roots[0]}
          jq -e '.cluster == "aspire2ap" and .commit == "6b116c69e911d292b32c4b698dc6a58f737b08fc"' "${root}/source/provenance.json"
          date -u +%FT%TZ
          job_id=$(awk '/^Job Id:/ {print $3}' "${root}/logs/pbs-accounting.txt")
          [[ "${job_id}" =~ ^[0-9]+[.][A-Za-z0-9.-]+$ ]]
          /opt/pbs/bin/qstat -x -f "${job_id}"
          for name in driver pbs pbs.stderr server-step prefill-0 prefill-1 decode-0 decode-1 router aiperf; do if [[ -s "${root}/logs/${name}.log" ]]; then printf '\nlog=%s\n' "${name}"; tail -n 6 "${root}/logs/${name}.log"; fi; done
          echo 'Read-only status of the original allocation; no submission or cancellation'
