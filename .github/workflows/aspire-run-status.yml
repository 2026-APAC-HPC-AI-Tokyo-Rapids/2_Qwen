name: Read the single unpinned ASPIRE MegaMoE run
on:
  push:
    branches: [perf/aspire-megamoe-port]
    paths: [.github/workflows/aspire-run-status.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read scheduler state and startup logs without modifying the run
        id: inspect
        shell: aspire2p-shell --github-shell {0}
        run: |
          set -euo pipefail
          roots=(/scratch/users/industry/ai-hpc/ACCOUNT/sglang-runs/pd-38778072624-1.*)
          test "${#roots[@]}" = 1
          root=${roots[0]}
          if [[ ! -f "${root}/source/provenance.json" ]]; then echo 'Runtime not present; consult deployment or completed archive'; exit 0; fi
          printf 'runtime_dir=%s\n' "${root}" >>"${GITHUB_OUTPUT}"
          jq -e '.cluster == "aspire2ap" and .commit == "682cc08ee6fd15c6df4a24acaa5414a74367013a"' "${root}/source/provenance.json"
          date -u +%FT%TZ
          if [[ -s "${root}/logs/pbs-accounting.txt" ]]; then job_id=$(awk '/^Job Id:/ {print $3}' "${root}/logs/pbs-accounting.txt"); [[ "${job_id}" =~ ^[0-9]+[.][A-Za-z0-9.-]+$ ]]; /opt/pbs/bin/qstat -x -f -F json "${job_id}" | jq '.Jobs | to_entries[] | {job_id: .key, state: .value.job_state, queue: .value.queue, select: .value.Resource_List.select, started: .value.stime, hosts: .value.exec_host, used: (.value.resources_used | del(.gpu_usage)), comment: .value.comment, estimated: .value.estimated}'; fi
          for path in "${root}/logs/"*.log; do if [[ -s "${path}" ]]; then printf '\nlog=%s\n' "${path##*/}"; tail -n 8 "${path}"; fi; done
          if [[ -s "${root}/results/score.json" ]]; then cat "${root}/results/score.json"; fi
      - name: Copy live logs and lightweight telemetry for stall diagnosis
        if: steps.inspect.outputs.runtime_dir != ''
        shell: home-lab-shell {0}
        env:
          RUNTIME_DIR: ${{ steps.inspect.outputs.runtime_dir }}
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/aspire-live-diagnosis-${GITHUB_RUN_ID}"
          install -d -m 0755 "${destination}"
          aspire2p-shell --pull "${RUNTIME_DIR}/logs" "${destination}/logs"
          aspire2p-shell --pull "${RUNTIME_DIR}/profile" "${destination}/profile"
      - uses: actions/upload-artifact@v7
        if: steps.inspect.outputs.runtime_dir != ''
        with:
          name: aspire-live-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/aspire-live-diagnosis-${{ github.run_id }}
          if-no-files-found: error
