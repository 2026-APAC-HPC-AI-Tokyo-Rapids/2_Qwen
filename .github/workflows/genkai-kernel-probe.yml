name: Genkai kernel probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  withdraw-owned-ep4:
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Withdraw only this task's queued EP4 job
        shell: genkai-shell --github-shell {0}
        run: |
          set -euo pipefail
          state=$(pjstat -A -S 7165140)
          grep -q 'JOB ID *: 7165140' <<<"${state}"
          grep -q 'JOB NAME *: qwen_kernel_probe' <<<"${state}"
          grep -q 'kernel-probe-40063020691-2.NTIuThpb' <<<"${state}"
          grep -q 'STATE *: QUE' <<<"${state}"
          pjdel 7165140
          timeout 60 pjwait -z 7165140
          pjstat -H -S 7165140 | grep -E 'JOB ID|STATE|PJM CODE|REASON|DELETE DATE'
