name: Genkai 1 GPU kernel probe

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: ベンチ準備スクリプト（共通runnerが生成された実行ファイルを起動）
        type: string
        default: kernels/probes/prepare-fc1.sh
      candidate_patch:
        description: 候補patchのリポジトリ内パス（空欄は現行同士の動作確認）
        type: string
        default: ""

permissions:
  contents: read

env:
  RUNTIME_ROOT: /fast/PROJECT/sglang-runs

defaults:
  run:
    shell: genkai-shell --github-shell {0}

jobs:
  probe:
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: login nodeでベンチを準備
        id: prepare
        env:
          BENCHMARK: ${{ inputs.benchmark }}
          CANDIDATE_PATCH: ${{ inputs.candidate_patch }}
        run: scripts/provision-genkai-kernel-probe.sh

      - name: 1 GPU・上限3分のPJMジョブを投入
        id: submit
        env:
          RUNTIME_DIR: ${{ steps.prepare.outputs.runtime_dir }}
        run: |
          cd "${RUNTIME_DIR}"
          submission=$(pjsub -x "RUNTIME_DIR=${RUNTIME_DIR}" -N qwen_kernel_probe -o "${RUNTIME_DIR}/logs/%j.pjm.log" --spath "${RUNTIME_DIR}/logs/%j.pjm.stats" "${RUNTIME_DIR}/scripts/run.pjm")
          printf '%s\n' "${submission}"
          job_id=$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<<"${submission}")
          [[ "${job_id}" =~ ^[0-9]+$ ]]
          printf 'job_id=%s\n' "${job_id}" >>"${GITHUB_OUTPUT}"

      - name: 終了・数値検査・3回の計時を確認
        env:
          RUNTIME_DIR: ${{ steps.prepare.outputs.runtime_dir }}
          PJM_JOB_ID: ${{ steps.submit.outputs.job_id }}
        shell: bash
        run: scripts/monitor-qwen-job.sh genkai-shell platforms/genkai/kernel-probe/check-job.sh

      - name: 結果をsummaryに表示
        if: always() && steps.prepare.outputs.runtime_dir != ''
        env:
          RUNTIME_DIR: ${{ steps.prepare.outputs.runtime_dir }}
        shell: bash
        run: |
          printf '### Genkai 1 GPU kernel benchmark\n\n' >>"${GITHUB_STEP_SUMMARY}"
          genkai-shell --github-shell platforms/genkai/kernel-probe/summary.sh >>"${GITHUB_STEP_SUMMARY}"

      - name: 終了済みの一時ファイルを削除
        if: always() && steps.prepare.outputs.runtime_dir != ''
        env:
          RUNTIME_DIR: ${{ steps.prepare.outputs.runtime_dir }}
          PJM_JOB_ID: ${{ steps.submit.outputs.job_id }}
        run: |
          if [[ -z "${PJM_JOB_ID}" ]] || timeout 20 pjwait -z "${PJM_JOB_ID}"; then chmod -R u+w "${RUNTIME_DIR:?}"; rm -rf -- "${RUNTIME_DIR:?}"; else printf 'Preserving runtime for pending job %s\n' "${PJM_JOB_ID}"; fi
