name: Inspect archived Firmus profile failures
on:
  push:
    paths:
      - .github/workflows/firmus-profile-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, home-lab]
    steps:
      - name: Read decisive archived logs and available Python
        shell: home-lab-shell {0}
        run: |
          ls -l /usr/bin/python* /usr/local/bin/python* /opt/uv/bin/uv /opt/venv/bin/python 2>/dev/null || true
          root=/srv/qwen-artifacts/37653746232/1
          find "${root}/profile" -type f -name '*stop*' -print -exec cat {} \;
          find "${root}/logs" -type f -name 'decode-0.log' -print -exec tail -n 20 {} \;
