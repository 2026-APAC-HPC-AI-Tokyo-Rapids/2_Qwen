# Execution is archived: jobs are disabled; preserve workflow history and logs.
name: ASPIRE 2A+でQwen3 PDを実行

on:
  workflow_call:
    inputs:
      node_count: {required: true, type: string}
      profile: {required: true, type: boolean}
      container_sha256: {required: true, type: string}
      container_size: {required: true, type: string}

permissions:
  actions: read
  contents: read

env:
  RUNTIME_ROOT: /scratch/users/industry/ai-hpc/ACCOUNT/sglang-runs

defaults:
  run:
    shell: aspire2p-shell --github-shell {0}

jobs:
  provision:
    if: ${{ false && (success()) }}
    name: PD実行環境を配備
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    outputs:
      runtime_dir: ${{ steps.provision.outputs.runtime_dir }}
    steps:
      - name: 2ノードを検証
        run: "test '${{ inputs.node_count }}' = 2"
      - name: 実行用ファイルを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: SquashFS・モデル・tokenizer・設定を配備
        id: provision
        env:
          CLUSTER_NAME: aspire2ap
          CONTAINER_ARCHIVE_DIR: /scratch/users/industry/ai-hpc/ACCOUNT/sglang-containers
          CONTAINER_SHA256: ${{ inputs.container_sha256 }}
          CONTAINER_SIZE: ${{ inputs.container_size }}
          ENROOT_LIBRARY_PATH: /home/ACCOUNT/.local/lib/enroot
          ENROOT_SYSCONF_PATH: /home/ACCOUNT/.local/etc/enroot
          MODEL_PATH: /scratch/users/industry/ai-hpc/ACCOUNT/Qwen/Qwen3-235B-A22B-Instruct-2507-FP8
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          [[ "${CONTAINER_SHA256}" == "$(jq -er .container_sha256 configs/aspire-serving.json)" ]] || { echo "ASPIRE MegaMoE requires the verified Firmus 40225743220 base image (build 40197369083, 9120.51 tok/s with the configured overlays); stage that archive before submitting." >&2; exit 1; }
          PROVISION_OUTPUT="${GITHUB_OUTPUT}" scripts/provision-qwen-pd.sh
          runtime_dir="$(sed -n 's/^runtime_dir=//p' "${GITHUB_OUTPUT}" | tail -n 1)"
          bash scripts/check-firmus-image.sh "${runtime_dir}/sglang.sqsh" "${runtime_dir}/source" "${GITHUB_WORKSPACE}"
          install -m 0755 scripts/stage-qwen-node-model.sh "${runtime_dir}/scripts/stage-qwen-node-model.sh"
          install -m 0644 research/simulation/greedy_probe.py "${runtime_dir}/scripts/greedy_probe.py"
          install -m 0644 configs/aspire-serving.json "${runtime_dir}/source/aspire-serving.json"
          bash scripts/stage-qwen-overlays.sh "${runtime_dir}" "${runtime_dir}/source/aspire-serving.json" "${GITHUB_WORKSPACE}"
          prefill_location="$(jq -er .prefill_expert_location configs/aspire-serving.json)"
          if [[ "${prefill_location}" != trivial ]]; then install -m 0644 "${GITHUB_WORKSPACE}/${prefill_location}" "${runtime_dir}/source/prefill-expert-location.json"; fi
          if [[ "$(jq -r '.speculation.algorithm' configs/aspire-serving.json)" == EAGLE3 ]]; then
            uvx --from 'huggingface_hub==0.36.0' hf download nebius/EAGLE3-Qwen3-235B-A22B-Instruct-2507 config.json README.md model.safetensors --revision ff0f0c0999f6c86b21dfd2f5803eebc4ac712224 --local-dir "${runtime_dir}/draft" --max-workers 1
            uv run --no-project --python 3.12.12 python research/simulation/prepare_eagle.py "${runtime_dir}/draft" "${runtime_dir}/source"
          fi
          bash scripts/check-aspire-runtime-mount.sh "${runtime_dir}" "${MODEL_PATH}" 2>&1 | tee "${runtime_dir}/logs/runtime-mount-preflight.log"
          install -m 0755 platforms/aspire2ap/run-qwen-pd.pbs "${runtime_dir}/scripts/run-qwen-pd.pbs"
      - name: 配備失敗時の実行環境を削除
        if: failure() && steps.provision.outputs.runtime_dir != ''
        env:
          RUNTIME_DIR: ${{ steps.provision.outputs.runtime_dir }}
        run: rm -rf -- "${RUNTIME_DIR:?}"

  run:
    if: ${{ false && (success()) }}
    name: 2ノード16 GPUでPDとAIPerfを実行
    needs: provision
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    env:
      MODEL_PATH: /scratch/users/industry/ai-hpc/ACCOUNT/Qwen/Qwen3-235B-A22B-Instruct-2507-FP8
      PROFILE: ${{ inputs.profile }}
      RUNTIME_DIR: ${{ needs.provision.outputs.runtime_dir }}
    steps:
      - name: 接続待ち処理を取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: PBSジョブを投入
        id: submit
        run: |
          cd "${RUNTIME_DIR}"
          variables="PROFILE=${PROFILE},RUNTIME_DIR=${RUNTIME_DIR}"
          job_id="$(/opt/pbs/bin/qsub -P 59010014 -l 'select=2:ncpus=112:ngpus=8:mem=1500gb:mpiprocs=1' -l place=scatter:excl -v "${variables}" -o "${RUNTIME_DIR}/logs/pbs.log" -e "${RUNTIME_DIR}/logs/pbs.stderr.log" -N qwen3_pd "${RUNTIME_DIR}/scripts/run-qwen-pd.pbs")"
          [[ "${job_id}" =~ ^[0-9]+([.][A-Za-z0-9.-]+)?$ ]]
          printf 'PBS_JOB_ID=%s\n' "${job_id}" >>"${GITHUB_ENV}"
          printf 'job_id=%s\n' "${job_id}" >>"${GITHUB_OUTPUT}"
      - name: PBSジョブの終了と公式成果物を確認
        shell: bash
        run: scripts/monitor-qwen-job.sh aspire2p-shell platforms/aspire2ap/check-qwen-job.sh
      - name: ログ・AIPerf・profile・来歴をrunnerへ回収
        id: collect
        if: always() && steps.submit.outputs.job_id != ''
        shell: home-lab-shell {0}
        run: |
          destination="${RUNNER_TEMP}/qwen-aspire2ap-pd"
          install -d -m 0755 "${destination}"
          aspire2p-shell --pull "${RUNTIME_DIR}/logs" "${destination}/logs"
          aspire2p-shell --pull "${RUNTIME_DIR}/profile" "${destination}/profile"
          aspire2p-shell --pull "${RUNTIME_DIR}/results" "${destination}/results"
          aspire2p-shell --pull "${RUNTIME_DIR}/source" "${destination}/source"
          aspire2p-shell --pull "${RUNTIME_DIR}/run-success" "${destination}/run-success"
      - name: 実行成果物を保存
        if: always() && steps.submit.outputs.job_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: qwen-aspire2ap-pd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-aspire2ap-pd
          if-no-files-found: error
      - name: 回収結果の検証用Pythonを準備
        if: always() && steps.submit.outputs.job_id != ''
        uses: astral-sh/setup-uv@v7
      - name: 回収した全DP rankの実設定とKV容量を検証
        if: always() && steps.collect.outcome == 'success'
        shell: bash
        run: |
          root="${RUNNER_TEMP}/qwen-aspire2ap-pd"
          config="${root}/source/source/aspire-serving.json"
          while IFS=$'\t' read -r role port; do uv run --no-project --python 3.13 python scripts/check-firmus-server-info.py "${config}" "${root}/results/results/server-info-${role}-${port}.json" "${role}"; done < <(jq -r '.workers[] | [.role,.port] | @tsv' "${config}")
      - name: 実行条件・結果をsummaryに記録
        if: always() && steps.submit.outputs.job_id != ''
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: uv run --no-project --python 3.13 python scripts/summarize-firmus-run.py "${RUNNER_TEMP}/qwen-aspire2ap-pd" --cluster aspire2ap --job-id "${PBS_JOB_ID}" --status "${JOB_STATUS}" >>"${GITHUB_STEP_SUMMARY}"
      - name: 実行環境と残留ジョブを削除
        if: always()
        run: if [[ -n "${PBS_JOB_ID:-}" ]] && /opt/pbs/bin/qstat "${PBS_JOB_ID}" >/dev/null 2>&1; then /opt/pbs/bin/qdel "${PBS_JOB_ID}"; fi; rm -rf -- "${RUNTIME_DIR:?}"
