name: Recover terminal Firmus profile artifacts

on:
  push:
    paths:
      - .github/workflows/firmus-profile-recovery.yml

permissions:
  contents: read
  actions: read

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[recover-profile-artifacts]') }}
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the original workflow to be terminal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api /repos/2026-APAC-HPC-AI-Tokyo-Rapids/2_Qwen/actions/runs/38268462101 --jq .status)" = completed
      - name: Verify the exact terminal allocation and source identity
        shell: firmus-shell --github-shell {0}
        run: |
          set -euo pipefail
          runtime=/scratch/home/ACCOUNT/qwen/runs/pd-38268462101-1.CfKXIfeSnw
          state=$(sacct --allocations --jobs=22989 --noheader --parsable2 --format=JobID,State | awk -F'|' '$1 == 22989 {print $2}')
          test "${state}" = TIMEOUT
          jq -e '.commit == "7fd6803e70b7dd0ff23295105589676381611383" and .workflow_run_id == "38268462101" and .workflow_run_attempt == "1" and .framework == "vllm" and .profile == true and .workload == "official" and .container.sha256 == "2012b52332deaecdab9a7a397a35412b7e098c40308f93560c7a419519ebfb0e" and .client_container.sha256 == "4b919a7465f1647f4eddc677393cef00f2f390a8544b52a5f6b2456dce940d62"' "${runtime}/source/provenance.json" >/dev/null
          test -s "${runtime}/results/score.json"
          for worker in prefill-0 prefill-1 prefill-2 prefill-3 prefill-4 prefill-5 decode-0; do test -s "${runtime}/profile/nsys-${worker}.nsys-rep"; done
      - name: Read the existing artifacts without submitting compute
        shell: home-lab-shell {0}
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/firmus-profile-38268462101"
          install -d -m 0755 "${destination}"
          for part in logs profile results source; do timeout --foreground 900 firmus-shell --pull "/scratch/home/ACCOUNT/qwen/runs/pd-38268462101-1.CfKXIfeSnw/${part}" "${destination}/${part}"; done
      - name: Complete the original attempt's canonical archive
        shell: home-lab-shell {0}
        run: |
          set -euo pipefail
          parent=/srv/qwen-artifacts/38268462101
          destination="${parent}/1"
          staging=$(mktemp -d "${parent}/.1.recovered.XXXXXXXXXX")
          backup="${parent}/.1.before-profile-recovery-${GITHUB_RUN_ID}"
          cp -a "${RUNNER_TEMP}/firmus-profile-38268462101/." "${staging}/"
          test -s "${staging}/source/source/provenance.json"
          test -s "${staging}/results/results/profile_export_aiperf.json"
          (cd "${staging}" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS && sha256sum --check SHA256SUMS)
          if test -d "${destination}"; then test ! -e "${backup}"; mv -T "${destination}" "${backup}"; fi
          mv -T "${staging}" "${destination}"
          (cd "${destination}" && sha256sum --check SHA256SUMS)
          if test -d "${backup}"; then test "$(realpath "${backup}")" = "$(realpath "${parent}")/.1.before-profile-recovery-${GITHUB_RUN_ID}"; rm -rf -- "${backup}"; fi
          printf 'Recovered existing Slurm22989 artifacts to original Actions38268462101 attempt1. No compute was submitted or changed.\n' >>"${GITHUB_STEP_SUMMARY}"
