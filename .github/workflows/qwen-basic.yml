name: Qwen Basic (Firmus)

on:
  push:
    branches: ["**"]
    paths-ignore: ["research/**", "**/*.md"]

permissions:
  actions: write
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  CONTAINER_BUCKET: ${{ vars.QWEN_CONTAINER_BUCKET }}

jobs:
  validate:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[basic]') && contains(github.event.head_commit.message, '[cluster:firmus]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Basic and shared control-plane CPU checks
        run: |
          find scripts platforms containers aws submission -type f \( -name '*.sh' -o -name '*.pjm' -o -name '*.pbs' -o -name '*.slurm' -o -name '*.sbatch' \) -print0 | xargs -0 -r -n1 bash -n
          uv run --project qwen-experiment-metrics ruff check qwen-experiment-metrics scripts containers
          uvx --from 'actionlint-py==1.7.12.24' actionlint
          uv run --project qwen-experiment-metrics pytest -q qwen-experiment-metrics/tests/test_basic_serving.py qwen-experiment-metrics/tests/test_aiperf_official.py qwen-experiment-metrics/tests/test_firmus_reference.py qwen-experiment-metrics/tests/test_firmus_cpu_lifecycle.py qwen-experiment-metrics/tests/test_scheduler_monitor.py qwen-experiment-metrics/tests/test_build_bootstrap.py qwen-experiment-metrics/tests/test_repository_contract.py qwen-experiment-metrics/tests/test_vllm_container.py

  stage:
    name: Basic SGLangのビルド入力をS3へ保存
    needs: validate
    if: startsWith(github.event.head_commit.message, '[require-build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: AWSの一時資格情報を取得
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.QWEN_AWS_BUILD_ROLE_ARN }}

      - name: checkout済みのビルド定義とGit metadataをarchive化
        run: |
          input_root="$(mktemp -d "${RUNNER_TEMP}/basic-build-input.XXXXXXXXXX")"
          trap 'rm -rf -- "${input_root}"' EXIT
          cp -a "${GITHUB_WORKSPACE}" "${input_root}/qwen"
          rm -f -- "${input_root}/qwen/.env"
          tar -I 'zstd -3 -T0' -cf "${RUNNER_TEMP}/qwen-build-input.tar.zst" -C "${input_root}" qwen
          aws s3 cp "${RUNNER_TEMP}/qwen-build-input.tar.zst" "s3://${CONTAINER_BUCKET}/inputs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/qwen-build-input.tar.zst" --only-show-errors

  build:
    name: AWSでBasic SGLangをビルド
    needs: stage
    uses: ./.github/workflows/aws-image-build.yml
    with:
      framework: basic
    secrets: inherit

  materialize:
    name: FirmusへBasic SGLang SquashFSを配布
    needs: build
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 60
    defaults:
      run:
        shell: firmus-shell --github-shell {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: AWSの一時資格情報を取得
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.QWEN_AWS_BUILD_ROLE_ARN }}

      - name: SHA-256検証後に独立したBasic SGLang archiveへ保存
        env:
          ACTION: build
          CONTAINER_FRAMEWORK: basic
          CONTAINER_ARCHIVE_DIR: /scratch/home/ACCOUNT/qwen/basic-containers
          CONTAINER_KEY: ${{ needs.build.outputs.container_key }}
          SIDECAR_KEY: ${{ needs.build.outputs.sidecar_key }}
          CONTAINER_SHA256: ${{ needs.build.outputs.container_sha256 }}
          CONTAINER_SIZE: ${{ needs.build.outputs.container_size }}
        run: |
          scripts/materialize-qwen-container.sh
          printf 'Firmus image: %s/%s.sqsh\n' "${CONTAINER_ARCHIVE_DIR}" "${GITHUB_RUN_ID}" >>"${GITHUB_STEP_SUMMARY}"

  serve:
    name: Firmus Basic official workload
    needs: [validate, materialize]
    if: ${{ always() && needs.validate.result == 'success' && (needs.materialize.result == 'success' || needs.materialize.result == 'skipped') && !contains(github.event.head_commit.message, '[build-only]') && !startsWith(github.event.head_commit.message, '[require-build]') }}
    uses: ./.github/workflows/firmus.yml
    with:
      basic: true
      config_path: configs/firmus-basic.json
      node_count: '2'
      profile: false
      require_build: false
    secrets: inherit

  archive-artifacts:
    name: 成果物を自宅サーバーへ保管
    needs: [serve]
    if: >-
      always() &&
      needs.serve.result != 'skipped'
    runs-on: [self-hosted, home-lab]
    permissions:
      actions: write
      contents: read
    env:
      QWEN_ARTIFACT_ARCHIVE_ROOT: /srv/qwen-artifacts

    steps:
      - name: ワークフロー成果物を取得
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: qwen-*-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 保管対象の有無を確認
        id: artifacts
        shell: bash
        run: if [[ -n "$(find artifacts -type f -print -quit 2>/dev/null)" ]]; then printf 'present=true\n' >>"${GITHUB_OUTPUT}"; else printf 'present=false\n' >>"${GITHUB_OUTPUT}"; fi

      - name: 成果物を自宅サーバーへ配置
        id: archive
        if: steps.artifacts.outputs.present == 'true'
        shell: home-lab-shell {0}
        run: |
          destination_parent="${QWEN_ARTIFACT_ARCHIVE_ROOT}/${GITHUB_RUN_ID}"
          destination="${destination_parent}/${GITHUB_RUN_ATTEMPT}"
          test -d artifacts
          test -n "$(find artifacts -type f -print -quit)"
          install -d -m 0750 "${destination_parent}"
          staging="$(mktemp -d "${destination_parent}/.${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          trap 'rm -rf -- "${staging}"' EXIT
          cp -a artifacts/. "${staging}/"
          (cd "${staging}" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS)
          mv -T -- "${staging}" "${destination}"
          trap - EXIT

      - name: 保管先をsummaryに記録
        if: always() && steps.archive.outcome == 'success'
        shell: bash
        run: printf '### Artifact archive\n\nArchived and checksummed at **archive-host:/srv/qwen-artifacts/%s/%s/**.\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_STEP_SUMMARY}"

      - name: 転送済みのGitHub成果物を削除
        if: steps.artifacts.outputs.present == 'true'
        shell: home-lab-shell {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("qwen-") and endswith("-${{ github.run_id }}-${{ github.run_attempt }}")) | .id' | while read -r artifact_id; do gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"; done
