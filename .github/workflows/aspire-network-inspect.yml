name: Inspect ASPIRE network topology without a GPU job
on:
  push:
    branches: [perf/aspire-megamoe-port]
    paths: [.github/workflows/aspire-network-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 3
    steps:
      - name: Read topology of the two completed-run hosts
        shell: aspire2p-shell --github-shell {0}
        run: |
          set -uo pipefail
          date -u +%FT%TZ
          for host in a2ap-dgx011 a2ap-dgx025; do
            printf '\nhost=%s\n' "${host}"
            ssh -o BatchMode=yes -o ConnectTimeout=5 "${host}" 'hostname; nvidia-smi topo -m; for port in /sys/class/infiniband/*/ports/1; do printf "\n%s\n" "$port"; cat "$port/state" "$port/link_layer" "$port/lid" "$port/gids/0"; readlink -f "$port/../../device"; done' || true
          done
          /opt/pbs/bin/pbsnodes -av a2ap-dgx011 a2ap-dgx025 | head -n 100
