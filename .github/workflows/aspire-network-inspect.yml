name: Inspect ASPIRE network topology without a GPU job
on:
  push:
    branches: [perf/aspire-megamoe-port]
    paths: [.github/workflows/aspire-network-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 3
    steps:
      - name: Read UCX defaults passed through the existing Enroot configuration
        shell: aspire2p-shell --github-shell {0}
        run: |
          set -euo pipefail
          source "${HOME}/.local/.setenv"
          date -u +%FT%TZ
          env | grep -E '^(UCX_|ENROOT_|LD_LIBRARY_PATH=)' || true
          grep -R -n -E 'UCX_|machine-id|hostid|LD_LIBRARY_PATH' "${ENROOT_SYSCONF_PATH}" "${ENROOT_LIBRARY_PATH}" "${HOME}/.local/.setenv" || true
