name: 玄界でQwenを実行

on:
  workflow_call:
    inputs:
      node_count:
        required: true
        type: string
      profile:
        required: true
        type: boolean
      require_build:
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

env:
  CONTAINER_ARCHIVE_DIR: /home/ACCOUNT/share/sglang-containers
  DATASET_CACHE_ROOT: /fast/PROJECT/datasets/ShareGPT_Vicuna_unfiltered
  GIT_MIRROR_DIR: /fast/PROJECT/git-mirror
  MODEL_CACHE_ROOT: /fast/PROJECT/Qwen/Qwen3.5-397B-A17B-FP8-metadata
  RUNTIME_ROOT: /fast/PROJECT/sglang-runs

defaults:
  run:
    shell: bash --login -eo pipefail {0}

jobs:
  select-container:
    name: OCIコンテナを選択
    runs-on: [self-hosted, genkai]
    timeout-minutes: 7200
    outputs:
      action: ${{ steps.select.outputs.action }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
    steps:
      - name: リポジトリ履歴を取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: コンテナツールを確認
        run: buildah --version && skopeo --version && umoci --version && enroot version && nvidia-container-cli --version

      - name: 既存成果物の再利用または新規ビルドを選択
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_BUILD: ${{ inputs.require_build }}
        run: '"${GITHUB_WORKSPACE}/scripts/select-qwen-container.sh"'

  reuse-container:
    name: OCIコンテナを再利用
    needs: select-container
    if: needs.select-container.outputs.action == 'reuse'
    runs-on: [self-hosted, genkai]
    timeout-minutes: 7200
    steps:
      - name: 選択した成果物をハードリンク
        run: |
          source_run_id='${{ needs.select-container.outputs.source_run_id }}'
          ln -f -- "${CONTAINER_ARCHIVE_DIR}/${source_run_id}.sqsh" "${CONTAINER_ARCHIVE_DIR}/${GITHUB_RUN_ID}.sqsh"
          ln -f -- "${CONTAINER_ARCHIVE_DIR}/${source_run_id}.container-sidecar.json" "${CONTAINER_ARCHIVE_DIR}/${GITHUB_RUN_ID}.container-sidecar.json"

  build-container:
    name: OCIコンテナをビルド
    needs: select-container
    if: needs.select-container.outputs.action == 'build'
    runs-on: [self-hosted, genkai]
    timeout-minutes: 7200
    concurrency:
      group: genkai-qwen-container-build
    env:
      BUILD_DIR: /dev/shm/qwen-sglang-container/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: ビルド入力を取得
        uses: actions/checkout@v7

      - name: buildah、skopeo、umociでコンテナを構築・保存
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"${GITHUB_WORKSPACE}/scripts/build-sglang-container.sh"'

      - name: コンテナビルドログを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen-genkai-container-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_DIR }}/logs
          if-no-files-found: warn
          compression-level: 1

      - name: コンテナビルド領域を削除
        if: always()
        run: chmod -R u+rwX "${BUILD_DIR}" 2>/dev/null || true; rm -rf -- "${BUILD_DIR:?}"

  provision:
    name: Enroot実行環境を配備
    needs: [select-container, reuse-container, build-container]
    if: ${{ always() && needs.select-container.result == 'success' && ((needs.select-container.outputs.action == 'reuse' && needs.reuse-container.result == 'success') || (needs.select-container.outputs.action == 'build' && needs.build-container.result == 'success')) }}
    runs-on: [self-hosted, genkai]
    timeout-minutes: 7200
    outputs:
      model_path: ${{ steps.provision.outputs.model_path }}
      run_id: ${{ steps.provision.outputs.run_id }}
      runtime_dir: ${{ steps.provision.outputs.runtime_dir }}
    steps:
      - name: 実行用ファイルを取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dummy model用メタデータと実行環境を配備
        id: provision
        env:
          CLUSTER_NAME: genkai
          CONTAINER_ARCHIVE: ${{ env.CONTAINER_ARCHIVE_DIR }}/${{ github.run_id }}.sqsh
          CONTAINER_SIDECAR: ${{ env.CONTAINER_ARCHIVE_DIR }}/${{ github.run_id }}.container-sidecar.json
          GPUS_PER_NODE: 4
          NODE_COUNT: ${{ inputs.node_count }}
          RESOURCE_GROUP: b-batch
          RUN_PURPOSE: ${{ inputs.profile && 'profile' || 'bench' }}
        run: |
          export PROVISION_OUTPUT="${GITHUB_OUTPUT}"
          "${GITHUB_WORKSPACE}/scripts/provision-qwen-runtime.sh"
          runtime_dir="$(sed -n 's/^runtime_dir=//p' "${GITHUB_OUTPUT}" | tail -n 1)"
          install -m 0755 "${GITHUB_WORKSPACE}/platforms/genkai/run-qwen35.pjm" "${runtime_dir}/scripts/run-qwen35.pjm"

      - name: 配備失敗時の実行環境を削除
        if: failure() && steps.provision.outputs.runtime_dir != ''
        env:
          RUNTIME_DIR: ${{ steps.provision.outputs.runtime_dir }}
        run: rm -rf -- "${RUNTIME_DIR:?}"

  run:
    name: Enrootでdummy modelを実行
    needs: provision
    if: always() && needs.provision.result == 'success'
    runs-on: [self-hosted, genkai]
    timeout-minutes: 7200
    env:
      MODEL_PATH: ${{ needs.provision.outputs.model_path }}
      RUNTIME_DIR: ${{ needs.provision.outputs.runtime_dir }}
    steps:
      - name: PJMジョブを投入
        id: submit
        run: |
          cd "${RUNTIME_DIR}"
          job_environment="RUNTIME_DIR=${RUNTIME_DIR},MODEL_PATH=${MODEL_PATH},CONTAINER_IMAGE=${RUNTIME_DIR}/sglang.sqsh,GPUS_PER_NODE=4"
          submission="$(pjsub -L "node=${{ inputs.node_count }}" --mpi "proc=${{ inputs.node_count }}" -x "${job_environment}" -o "${RUNTIME_DIR}/logs/%j.log" -j -N qwen35_dummy "${RUNTIME_DIR}/scripts/run-qwen35.pjm")"
          printf '%s\n' "${submission}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<<"${submission}")"
          test -n "${job_id}"
          printf 'PJM_JOB_ID=%s\n' "${job_id}" >>"${GITHUB_ENV}"
          printf 'job_id=%s\n' "${job_id}" >>"${GITHUB_OUTPUT}"

      - name: PJMジョブの開始を待機
        run: |
          while [[ ! -e "${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log" ]]; do wait_status="$(pjwait -w waitnone "${PJM_JOB_ID}")"; pjm_code="$(awk 'NR == 1 {print $2}' <<<"${wait_status}")"; if [[ -n "${pjm_code}" && "${pjm_code}" != X ]]; then printf '%s\n' "${wait_status}"; exit 1; fi; sleep 2; done

      - name: PJM実行ログを表示して終了を待機
        run: |
          tail --lines=+1 --follow=name "${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log" &
          tail_pid=$!
          trap 'kill "${tail_pid}" 2>/dev/null || true; wait "${tail_pid}" 2>/dev/null || true' EXIT
          pjwait -z "${PJM_JOB_ID}"
          kill "${tail_pid}" 2>/dev/null || true
          wait "${tail_pid}" 2>/dev/null || true
          trap - EXIT
          cat "${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log"
          pjwait "${PJM_JOB_ID}"
          test -e "${RUNTIME_DIR}/run-success"

      - name: ログインrunnerから計測断片を送信
        env:
          METRICS_CREDENTIAL_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: '"${RUNTIME_DIR}/scripts/send-qwen-fragments.sh"'

      - name: 公式形式で実行成果物を梱包
        if: always() && steps.submit.outputs.job_id != ''
        run: '"${RUNTIME_DIR}/scripts/package-qwen-runtime.sh"'

      - name: 固定構成の成果物を保存
        if: always() && steps.submit.outputs.job_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: qwen-genkai-dummy-${{ needs.provision.outputs.run_id }}
          path: |
            ${{ env.RUNTIME_DIR }}/run-artifacts.tar.zst
            ${{ env.RUNTIME_DIR }}/artifact-manifest.json
            ${{ env.RUNTIME_DIR }}/profile-raw.tar.zst
          if-no-files-found: error
          compression-level: 0

      - name: 実行環境を削除
        if: always()
        run: if [[ -n "${PJM_JOB_ID:-}" ]]; then pjdel "${PJM_JOB_ID}" 2>/dev/null || true; pjwait -z "${PJM_JOB_ID}" 2>/dev/null || true; fi; rm -rf -- "${RUNTIME_DIR:?}"
