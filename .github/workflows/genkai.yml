name: SGLang Qwen 3.5 on Genkai

on:
  workflow_dispatch:
    inputs:
      require_build:
        description: Build from source instead of reusing the nearest successful SIF from the first-parent history
        required: true
        default: false
        type: boolean
  push:
    paths-ignore:
      - '**/.md'

permissions:
  actions: read
  contents: read

env:
  SIF_ARCHIVE_DIR: /home/ACCOUNT/share/sglang-sifs
  GIT_MIRROR_DIR: /fast/PROJECT/git-mirror
  MODEL_PATH: /fast/PROJECT/Qwen/Qwen3.5-397B-A17B-FP8
  DATASET_PATH: /fast/PROJECT/datasets/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json

defaults:
  run:
    shell: bash --login -eo pipefail {0}

jobs:
  select-sif:
    name: Select SGLang SIF
    runs-on: [self-hosted, genkai]

    outputs:
      action: ${{ steps.select.outputs.action }}
      source_run_number: ${{ steps.select.outputs.source_run_number }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select an existing SIF or a new build
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ '${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[require-build]')) || (github.event_name == 'workflow_dispatch' && inputs.require_build) }}' == true ]]; then
            echo "A new SIF build was explicitly requested"
            echo "action=build" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          commit="${GITHUB_SHA}"
          while [[ -n "${commit}" ]]
          do
            while IFS=$'\t' read -r run_id run_number
            do
              [[ "${run_id}" != "${GITHUB_RUN_ID}" ]] || continue
              [[ -s "${SIF_ARCHIVE_DIR}/${run_number}.sif" ]] || continue
              if ! archive_step_count="$(gh run view "${run_id}" --json jobs --jq '[.jobs[].steps[] | select((.name == "Build and publish SGLang SIF" or .name == "Hardlink the selected SIF") and .conclusion == "success")] | length' 2>/dev/null)"; then
                continue
              fi
              [[ "${archive_step_count}" -gt 0 ]] || continue
              echo "Selected ${SIF_ARCHIVE_DIR}/${run_number}.sif"
              echo "action=reuse" >> "${GITHUB_OUTPUT}"
              echo "source_run_number=${run_number}" >> "${GITHUB_OUTPUT}"
              exit 0
            done < <(gh run list --workflow genkai.yml --commit "${commit}" --limit 20 --json databaseId,number --jq '.[] | [.databaseId, .number] | @tsv')
            commit="$(git rev-parse "${commit}^" 2>/dev/null || true)"
          done
          echo "No reusable SIF was found; falling back to a new build"
          echo "action=build" >> "${GITHUB_OUTPUT}"

  reuse-sif:
    name: Reuse SGLang SIF
    needs: select-sif
    if: needs.select-sif.outputs.action == 'reuse'
    runs-on: [self-hosted, genkai]

    steps:
      - name: Hardlink the selected SIF
        run: ln -f -- "${SIF_ARCHIVE_DIR}/${{ needs.select-sif.outputs.source_run_number }}.sif" "${SIF_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.sif"

  build-sif:
    name: Build SGLang SIF on Genkai login node
    needs: select-sif
    if: needs.select-sif.outputs.action == 'build'
    runs-on: [self-hosted, genkai]

    concurrency:
      group: sglang-sif-build-dev-shm
      queue: max

    env:
      BUILD_DIR: /dev/shm/qwen-sglang-build/run-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v6

      - name: Build and publish SGLang SIF
        run: "${GITHUB_WORKSPACE}/scripts/build-sglang-sif.sh"

      - name: Upload SGLang build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sglang-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_DIR }}/logs
          compression-level: 1

      - name: Cleanup SGLang build directory
        if: always()
        run: |
          : "${BUILD_DIR:?}"
          [[ -d "${BUILD_DIR}" ]] || exit 0

          module load singularity-ce/4.1.3
          singularity exec --fakeroot --containall --bind "${BUILD_DIR:?}:/cleanup" docker://busybox:1.36.1-musl /bin/sh -c 'rm -rf -- /cleanup/* /cleanup/.[!.]* /cleanup/..?*'
          rmdir -- "${BUILD_DIR:?}"

  provision:
    name: Provision SGLang runtime
    needs: [select-sif, reuse-sif, build-sif]
    if: >-
      always() &&
      needs.select-sif.result == 'success' &&
      ((needs.select-sif.outputs.action == 'reuse' && needs.reuse-sif.result == 'success') ||
       (needs.select-sif.outputs.action == 'build' && needs.build-sif.result == 'success'))
    runs-on: [self-hosted, genkai]

    env:
      SIF_SOURCE_RUN_NUMBER: ${{ needs.select-sif.outputs.source_run_number }}

    outputs:
      runtime_dir: ${{ steps.provision_runtime.outputs.runtime_dir }}

    steps:
      - name: Checkout runtime files
        uses: actions/checkout@v6

      - name: Provision SGLang runtime
        id: provision_runtime
        run: |
          test -s "${MODEL_PATH}/config.json"
          jq -e '(.model_type | strings | startswith("qwen3_5")) and ((.architectures // []) | any(.[]?; type == "string" and startswith("Qwen3_5")))' "${MODEL_PATH}/config.json" >/dev/null
          weight_index="${MODEL_PATH}/model.safetensors.index.json"
          test -s "${weight_index}"
          jq -e '.weight_map | type == "object" and length > 0' "${weight_index}" >/dev/null
          while IFS= read -r shard; do
            test -s "${MODEL_PATH}/${shard}"
          done < <(jq -r '.weight_map[]' "${weight_index}" | sort -u)
          uvx --from 'huggingface_hub>=1.0' hf download anon8231489123/ShareGPT_Vicuna_unfiltered --repo-type dataset --include ShareGPT_V3_unfiltered_cleaned_split.json --local-dir /fast/PROJECT/datasets/ShareGPT_Vicuna_unfiltered

          install -d -m 2775 /fast/PROJECT/sglang-runs
          runtime_dir="$(mktemp -d "/fast/PROJECT/sglang-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          echo "runtime_dir=${runtime_dir}" >> "${GITHUB_OUTPUT}"
          source_run_number="${SIF_SOURCE_RUN_NUMBER:-${GITHUB_RUN_NUMBER}}"
          cd "${runtime_dir}"
          mkdir scripts logs results metrics-socket
          ln -s "${SIF_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.sif" sglang.sif
          printf '%s\n' "${source_run_number}" > sif-source-run.txt
          install -m 0755 "${GITHUB_WORKSPACE}/scripts/run-qwen35.pjm" "${GITHUB_WORKSPACE}/scripts/run-qwen35-node.sh" "${GITHUB_WORKSPACE}/scripts/exec-profiler.sh" scripts/
          cp -a "${GITHUB_WORKSPACE}/qwen-experiment-metrics" qwen-experiment-metrics
          uv sync --project qwen-experiment-metrics --frozen --no-dev
          jq -n \
            --arg sif_source_workflow_run_number "${source_run_number}" \
            --arg sif_size_bytes "$(stat --format=%s sglang.sif)" \
            --arg dataset_size_bytes "$(stat --format=%s "${DATASET_PATH}")" \
            '{sif: {source_workflow_run_number: $sif_source_workflow_run_number, size_bytes: $sif_size_bytes}, dataset: {size_bytes: $dataset_size_bytes}}' \
            > metrics-artifacts.json
          test -x qwen-experiment-metrics/.venv/bin/qwen-experiment-metrics

      - name: Cleanup failed SGLang provisioning
        if: failure() && steps.provision_runtime.outputs.runtime_dir != ''
        env:
          RUNTIME_DIR: ${{ steps.provision_runtime.outputs.runtime_dir }}
        run: rm -rf -- "${RUNTIME_DIR:?}"

  run:
    name: Run Qwen 3.5 with SGLang
    needs: provision
    if: always() && needs.provision.result == 'success'
    runs-on: [self-hosted, genkai]
    timeout-minutes: 7200

    env:
      RUNTIME_DIR: ${{ needs.provision.outputs.runtime_dir }}

    steps:
      - name: Submit Qwen job
        env:
          EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: |
          test -n "${EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON}"
          credentials_base64="$(printf '%s' "${EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON}" | base64 --wrap=0)"
          job_environment="RUNTIME_DIR=${RUNTIME_DIR},MODEL_PATH=${MODEL_PATH},DATASET_PATH=${DATASET_PATH},GITHUB_RUN_ID=${GITHUB_RUN_ID},GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT},GITHUB_REPOSITORY=${GITHUB_REPOSITORY},GITHUB_SHA=${GITHUB_SHA},EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_BASE64=${credentials_base64}"
          job_output="$(pjsub -x "${job_environment}" -o "${RUNTIME_DIR}/logs/%j.log" -j -N qwen35_sglang "${RUNTIME_DIR}/scripts/run-qwen35.pjm")"
          printf '%s\n' "${job_output}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<< "${job_output}")"
          test -n "${job_id}"
          echo "PJM_JOB_ID=${job_id}" >> "${GITHUB_ENV}"

      - name: Wait for Qwen job to start
        run: |
          while [[ ! -e "${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log" ]]; do
            wait_status="$(pjwait -w waitnone "${PJM_JOB_ID}")"
            pjm_code="$(awk 'NR == 1 { print $2 }' <<< "${wait_status}")"
            if [[ -n "${pjm_code}" && "${pjm_code}" != X ]]; then
              printf '%s\n' "${wait_status}"
              echo "PJM job ended before creating ${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log" >&2
              exit 1
            fi
            sleep 2
          done
          echo "PJM job log is ready: ${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log"

      - name: Stream Qwen execution log
        run: |
          tail --lines=+1 --follow=name "${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log" &
          tail_pid=$!
          stop_tail() {
            kill "${tail_pid}" 2>/dev/null || true
            wait "${tail_pid}" 2>/dev/null || true
          }
          trap stop_tail EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          pjwait -z "${PJM_JOB_ID}"
          sleep 1

      - name: Verify Qwen job completion
        run: |
          pjwait "${PJM_JOB_ID}"
          test -e "${RUNTIME_DIR}/run-success"

      - name: Collect PJM accounting metrics
        if: always() && env.PJM_JOB_ID != ''
        env:
          EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: |
          "${RUNTIME_DIR}/qwen-experiment-metrics/.venv/bin/qwen-experiment-metrics" \
            collect log-artifact \
            --runtime-dir "${RUNTIME_DIR}" \
            --job-id "${PJM_JOB_ID}"
          "${RUNTIME_DIR}/qwen-experiment-metrics/.venv/bin/qwen-experiment-metrics" \
            collect scheduler \
            --runtime-dir "${RUNTIME_DIR}" \
            --job-id "${PJM_JOB_ID}"

      - name: Upload Qwen execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen35-sglang-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_DIR }}/logs
          compression-level: 1

      - name: Upload Qwen inference results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen35-sglang-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_DIR }}/results
          compression-level: 0

      - name: Cleanup provisioned runtime
        if: always()
        run: |
          if [[ -n "${PJM_JOB_ID:-}" ]]; then
            pjdel "${PJM_JOB_ID}" 2>/dev/null || true
            pjwait -z "${PJM_JOB_ID}" || true
          fi
          rm -rf -- "${RUNTIME_DIR:?}"
