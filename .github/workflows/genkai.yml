name: SGLang Qwen 3.5 on Genkai

on:
  workflow_dispatch:
    inputs:
      require_build:
        description: Build from source instead of reusing the nearest successful SIF from the first-parent history
        required: true
        default: false
        type: boolean
  push:
    paths-ignore:
      - '**/.md'

permissions:
  actions: read
  contents: read

env:
  TMPDIR: /dev/shm
  SIF_ARCHIVE_DIR: /fast/PROJECT/sglang-sifs
  MODEL_PATH: /fast/PROJECT/Qwen/Qwen3.5-35B-A3B-FP8
  DATASET_PATH: /fast/PROJECT/datasets/ShareGPT_Vicuna_unfiltered/192ab2185289094fc556ec8ce5ce1e8e587154ca/ShareGPT_V3_unfiltered_cleaned_split.json

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    name: Build SGLang SIF
    runs-on: [self-hosted, genkai]

    # SIF archive names are global to this repository's workflow runs.
    concurrency:
      group: genkai-sglang-build
      cancel-in-progress: false

    env:
      SKIP_BUILD: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[require-build]')) || (github.event_name == 'workflow_dispatch' && !inputs.require_build) }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Link previous SGLang SIF
        if: ${{ fromJSON(env.SKIP_BUILD) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="${GITHUB_SHA}"
          # Compatibility is a caller decision.  A later provision/run failure
          # does not invalidate an already archived, immutable build result.
          while parent_commit="$(git rev-parse "${commit}^" 2>/dev/null)"
          do
            while IFS=$'\t' read -r run_id run_number
            do
              source_sif="${SIF_ARCHIVE_DIR}/${run_number}.sif"
              [[ -s "${source_sif}" ]] || continue
              build_steps="$(gh run view "${run_id}" --json jobs --jq '[.jobs[].steps[] | select(.name == "Archive SGLang SIF" and .conclusion == "success")] | length')"
              if [[ "${build_steps}" -gt 0 ]]; then
                echo "Reusing ${source_sif}"
                ln -f "${source_sif}" "${SIF_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.sif"
                exit 0
              fi
            done < <(gh run list --workflow genkai.yml --commit "${parent_commit}" --limit 20 --json databaseId,number --jq '.[] | [.databaseId, .number] | @tsv')
            commit="${parent_commit}"
          done
          echo "No reusable SGLang SIF was found in the first-parent history" >&2
          exit 1

      - name: Prepare build workspace
        if: ${{ ! fromJSON(env.SKIP_BUILD) }}
        id: prepare_build_workspace
        run: |
          install -d -m 2775 "${SIF_ARCHIVE_DIR}" /fast/PROJECT/sglang-build-jobs
          build_dir="$(mktemp -d "/fast/PROJECT/sglang-build-jobs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          mkdir -p "${build_dir}/source/containers" "${build_dir}/source/patches" "${build_dir}/logs"
          cp "${GITHUB_WORKSPACE}/containers/sglang.def" "${build_dir}/source/containers/"
          cp -a "${GITHUB_WORKSPACE}/patches/sglang" "${build_dir}/source/patches/"
          {
            echo "BUILD_DIR=${build_dir}"
            echo "ROOTFS_TAR=${build_dir}/rootfs.tar"
            echo "ROOTFS_SQSH=${build_dir}/rootfs.sqsh"
            echo "SIF_TMP=${SIF_ARCHIVE_DIR}/.${GITHUB_RUN_NUMBER}.sif.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tmp"
          } >> "${GITHUB_ENV}"

      - name: Provision SGLang sandbox on login node
        if: ${{ ! fromJSON(env.SKIP_BUILD) }}
        run: |
          singularity_builder=/fast/PROJECT/sglang-tools/singularity-ce-4.1.3-no-xattrs/bin/singularity
          provision_tmp="$(mktemp -d /dev/shm/sglang-provision.XXXXXXXXXX)"
          trap 'rm -rf -- "${provision_tmp:?}" 2>/dev/null || true' EXIT
          mkdir -p "${provision_tmp}/tmp"
          export SINGULARITY_TMPDIR="${provision_tmp}/tmp"
          export TMPDIR="${provision_tmp}/tmp"
          cd "${BUILD_DIR}/source"
          "${singularity_builder}" build --fakeroot --sandbox "${provision_tmp}/sandbox" containers/sglang.def 2>&1 | tee "${BUILD_DIR}/logs/provision.log"
          "${singularity_builder}" inspect --json "${provision_tmp}/sandbox" > metadata.json
          # A plain tar is the immutable hand-off between login provisioning
          # and compute-node packing.  It avoids millions of shared-FS files
          # without spending CPU on compression on the login node.
          : > "${ROOTFS_TAR}"
          # Do not let Singularity's convenience binds leak the login node's
          # home, cwd, or temporary files into the rootfs hand-off.
          "${singularity_builder}" exec --fakeroot --containall --cleanenv \
            --no-mount home,cwd,tmp,hostfs \
            --bind "${ROOTFS_TAR}:/rootfs.tar" \
            "${provision_tmp}/sandbox" \
            tar --numeric-owner -C / \
              --exclude=./dev --exclude=./fast --exclude=./home \
              --exclude=./proc --exclude=./rootfs.tar --exclude=./run \
              --exclude=./sys --exclude=./tmp --exclude=./var/tmp \
              -cf /rootfs.tar .

      - name: Pack provisioned sandbox into SIF
        if: ${{ ! fromJSON(env.SKIP_BUILD) }}
        run: |
          job_script="$(mktemp /dev/shm/sglang-sif-build.XXXXXXXXXX)"
          trap 'rm -f -- "${job_script}"' EXIT
          cat > "${job_script}" <<PJM
          #!/usr/bin/env bash
          #PJM -L rscgrp=a-batch
          #PJM -L vnode-core=60
          #PJM -L elapse=02:00:00
          #PJM -j
          #PJM -o ${BUILD_DIR}/logs/%j.log
          #PJM -N sglang_sif_build

          set -euo pipefail
          pack_dir="\$(mktemp -d /var/tmp/sglang-sif.XXXXXXXXXX)"
          trap 'rm -rf -- "\${pack_dir:?}"' EXIT
          mkdir "\${pack_dir}/sandbox"
          tar --no-same-owner -C "\${pack_dir}/sandbox" -xf "${ROOTFS_TAR}"
          /usr/sbin/mksquashfs "\${pack_dir}/sandbox" "${ROOTFS_SQSH}" -noappend -no-xattrs -no-progress -processors 60 -comp gzip -Xcompression-level 1
          touch "${BUILD_DIR}/build-success"
          PJM
          job_output="$(pjsub "${job_script}")"
          printf '%s\n' "${job_output}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<< "${job_output}")"
          test -n "${job_id}"
          log_file="${BUILD_DIR}/logs/${job_id}.log"
          while [[ ! -e "${log_file}" ]]; do
            if ! pjstat "${job_id}" | grep -q "^${job_id}[[:space:]]"; then
              echo "SGLang SIF build ${job_id} did not create a scheduler log" >&2
              exit 1
            fi
            sleep 1
          done
          tail -n +1 -F "${log_file}" &
          tail_pid=$!
          stop_log_stream() {
            kill "${tail_pid}" 2>/dev/null || true
            wait "${tail_pid}" 2>/dev/null || true
          }
          trap stop_log_stream EXIT
          while pjstat "${job_id}" | grep -q "^${job_id}[[:space:]]"; do
            sleep 10
          done
          sleep 1
          stop_log_stream
          trap - EXIT
          test -e "${BUILD_DIR}/build-success"
          singularity_builder=/fast/PROJECT/sglang-tools/singularity-ce-4.1.3-no-xattrs/bin/singularity
          "${singularity_builder}" sif new "${SIF_TMP}"
          "${singularity_builder}" sif add "${SIF_TMP}" "${BUILD_DIR}/source/containers/sglang.def" --datatype 1 --groupid 1
          "${singularity_builder}" sif add "${SIF_TMP}" "${BUILD_DIR}/source/metadata.json" --datatype 6 --groupid 1
          "${singularity_builder}" sif add "${SIF_TMP}" "${ROOTFS_SQSH}" --datatype 4 --parttype 1 --partfs 1 --partarch 2 --groupid 1
          "${singularity_builder}" sif setprim 3 "${SIF_TMP}"

      - name: Archive SGLang SIF
        if: ${{ ! fromJSON(env.SKIP_BUILD) }}
        run: mv "${SIF_TMP}" "${SIF_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.sif"

      - name: Upload SGLang build log
        if: always() && steps.prepare_build_workspace.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: sglang-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_DIR }}/logs
          compression-level: 1

      - name: Cleanup build workspace
        if: always() && steps.prepare_build_workspace.outcome == 'success'
        run: |
          rm -f -- "${SIF_TMP:?}"
          rm -rf -- "${BUILD_DIR:?}"

  provision:
    name: Provision SGLang runtime
    needs: build
    runs-on: [self-hosted, genkai]

    outputs:
      runtime_dir: ${{ steps.provision_runtime.outputs.runtime_dir }}

    steps:
      - name: Checkout runtime files
        uses: actions/checkout@v6

      - name: Provision SGLang runtime
        id: provision_runtime
        run: |
          sif="${SIF_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.sif"
          "${GITHUB_WORKSPACE}/scripts/provision-qwen35.sh"

          install -d -m 2775 /fast/PROJECT/sglang-runs
          runtime_dir="$(mktemp -d "/fast/PROJECT/sglang-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          mkdir -p "${runtime_dir}/scripts" "${runtime_dir}/logs" "${runtime_dir}/results"
          ln "${sif}" "${runtime_dir}/sglang.sif"
          install -m 0755 "${GITHUB_WORKSPACE}/scripts/run-qwen35.sh" "${GITHUB_WORKSPACE}/scripts/exec-profiler.sh" "${runtime_dir}/scripts/"
          echo "runtime_dir=${runtime_dir}" >> "${GITHUB_OUTPUT}"

  run:
    name: Run Qwen 3.5 with SGLang
    needs: provision
    runs-on: [self-hosted, genkai]

    env:
      RUNTIME_DIR: ${{ needs.provision.outputs.runtime_dir }}

    steps:
      - name: Submit and wait for a Qwen node
        run: |
          job_script="$(mktemp /dev/shm/qwen35-sglang.XXXXXXXXXX)"
          trap 'rm -f -- "${job_script}"' EXIT
          cat > "${job_script}" <<PJM
          #!/usr/bin/env bash
          #PJM -L rscgrp=b-batch
          #PJM -L elapse=00:10:00
          #PJM -L gpu=1
          #PJM -j
          #PJM -o ${RUNTIME_DIR}/logs/%j.log
          #PJM -N qwen35_sglang

          set -euo pipefail
          export MODEL_PATH='${MODEL_PATH}'
          export DATASET_PATH='${DATASET_PATH}'
          exec "${RUNTIME_DIR}/scripts/run-qwen35.sh" "${RUNTIME_DIR}"
          PJM
          job_output="$(pjsub "${job_script}")"
          printf '%s\n' "${job_output}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<< "${job_output}")"
          test -n "${job_id}"
          echo "PJM_JOB_ID=${job_id}" >> "${GITHUB_ENV}"
          log_file="${RUNTIME_DIR}/logs/${job_id}.log"
          while [[ ! -e "${log_file}" ]]; do
            if ! pjstat "${job_id}" | grep -q "^${job_id}[[:space:]]"; then
              echo "Qwen 3.5 job ${job_id} did not create a scheduler log" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Monitor Qwen 3.5 execution
        run: |
          log_file="${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log"
          tail -n +1 -F "${log_file}" &
          tail_pid=$!
          stop_log_stream() {
            kill "${tail_pid}" 2>/dev/null || true
            wait "${tail_pid}" 2>/dev/null || true
          }
          trap stop_log_stream EXIT
          while pjstat "${PJM_JOB_ID}" | grep -q "^${PJM_JOB_ID}[[:space:]]"; do
            sleep 10
          done
          sleep 1
          stop_log_stream
          trap - EXIT
          test -e "${RUNTIME_DIR}/run-success"

      - name: Upload Qwen execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen35-sglang-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_DIR }}/logs
          compression-level: 1

      - name: Upload Qwen inference results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen35-sglang-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_DIR }}/results
          compression-level: 0

      - name: Cleanup provisioned runtime
        if: always()
        run: rm -rf -- "${RUNTIME_DIR:?}"
