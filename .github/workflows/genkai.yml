name: 玄界でQwenコンテナを確認

on:
  workflow_call:
    inputs:
      node_count:
        required: true
        type: string
      container_sha256:
        required: true
        type: string
      container_size:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  RUNTIME_ROOT: /fast/PROJECT/sglang-runs

defaults:
  run:
    shell: genkai-shell --github-shell {0}

jobs:
  provision:
    name: ローカルarchiveからSquashFSを配備
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 180
    outputs:
      runtime_dir: ${{ steps.provision.outputs.runtime_dir }}
    steps:
      - name: 実行用ファイルを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: archiveのSquashFSを実行領域へ配備
        id: provision
        env:
          CLUSTER_NAME: genkai
          CONTAINER_ARCHIVE_DIR: /home/ACCOUNT/share/sglang-containers
          CONTAINER_SHA256: ${{ inputs.container_sha256 }}
          CONTAINER_SIZE: ${{ inputs.container_size }}
          ENROOT_LIBRARY_PATH: /home/ACCOUNT/ku60000563/.local/lib/enroot
          ENROOT_SYSCONF_PATH: /home/ACCOUNT/ku60000563/.local/etc/enroot
        run: |
          export PROVISION_OUTPUT="${GITHUB_OUTPUT}"
          "${GITHUB_WORKSPACE}/scripts/provision-qwen-check-env.sh"
          runtime_dir="$(sed -n 's/^runtime_dir=//p' "${GITHUB_OUTPUT}" | tail -n 1)"
          install -m 0755 "${GITHUB_WORKSPACE}/platforms/genkai/check-qwen-container.pjm" "${runtime_dir}/scripts/check-qwen-container.pjm"

      - name: 配備失敗時の実行環境を削除
        if: failure() && steps.provision.outputs.runtime_dir != ''
        env:
          RUNTIME_DIR: ${{ steps.provision.outputs.runtime_dir }}
        run: rm -rf -- "${RUNTIME_DIR:?}"

  run:
    name: GPUノードでEnroot check_envを実行
    needs: provision
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 7200
    env:
      RUNTIME_DIR: ${{ needs.provision.outputs.runtime_dir }}
    steps:
      - name: PJMジョブを投入
        id: submit
        run: |
          cd "${RUNTIME_DIR}"
          job_environment="RUNTIME_DIR=${RUNTIME_DIR}"
          submission="$(pjsub -L "node=${{ inputs.node_count }}" --mpi "proc=1" -x "${job_environment}" -o "${RUNTIME_DIR}/logs/%j.log" -j -N qwen_check_env "${RUNTIME_DIR}/scripts/check-qwen-container.pjm")"
          printf '%s\n' "${submission}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<<"${submission}")"
          test -n "${job_id}"
          printf 'PJM_JOB_ID=%s\n' "${job_id}" >>"${GITHUB_ENV}"
          printf 'job_id=%s\n' "${job_id}" >>"${GITHUB_OUTPUT}"

      - name: PJMジョブの開始を待機
        run: |
          while [[ ! -e "${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log" ]]; do wait_status="$(pjwait -w waitnone "${PJM_JOB_ID}")"; pjm_code="$(awk 'NR == 1 {print $2}' <<<"${wait_status}")"; if [[ -n "${pjm_code}" && "${pjm_code}" != X ]]; then printf '%s\n' "${wait_status}"; exit 1; fi; sleep 2; done

      - name: PJMジョブの終了を確認
        run: |
          pjwait -z "${PJM_JOB_ID}"
          cat "${RUNTIME_DIR}/logs/${PJM_JOB_ID}.log"
          pjwait "${PJM_JOB_ID}"
          test -e "${RUNTIME_DIR}/run-success"

      - name: check_envログをrunnerへ回収
        if: always() && steps.submit.outputs.job_id != ''
        shell: home-lab-shell {0}
        run: |
          destination="${RUNNER_TEMP}/qwen-genkai-check-env"
          genkai-shell --pull "${RUNTIME_DIR}/logs" "${destination}"
          genkai-shell --pull "${RUNTIME_DIR}/source" "${destination}"
          genkai-shell --pull "${RUNTIME_DIR}/run-success" "${destination}"

      - name: check_envログを保存
        if: always() && steps.submit.outputs.job_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: qwen-genkai-check-env-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-genkai-check-env
          if-no-files-found: error

      - name: 実行環境を削除
        if: always()
        run: if [[ -n "${PJM_JOB_ID:-}" ]]; then pjdel "${PJM_JOB_ID}" 2>/dev/null || true; pjwait -z "${PJM_JOB_ID}" 2>/dev/null || true; fi; rm -rf -- "${RUNTIME_DIR:?}"
