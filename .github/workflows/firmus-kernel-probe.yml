name: Stop user-requested Firmus job 26800
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop:
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cancel only Slurm 26800 and verify terminal state
        shell: bash
        run: firmus-shell --github-shell scripts/stop-firmus-26800.sh
