name: Qwen

on:
  push:
    paths-ignore:
      - "research/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      run_genkai:
        description: 玄界で実行する
        required: true
        default: false
        type: boolean
      run_aspire2ap:
        description: ASPIRE 2A+で実行する
        required: true
        default: false
        type: boolean
      run_firmus:
        description: Firmusで実行する
        required: true
        default: true
        type: boolean
      node_count:
        description: 実行ノード数
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
      profile:
        description: 通常計測の代わりにプロファイルを取得する
        required: true
        default: false
        type: boolean
      require_build:
        description: 既存成果物を再利用せず新しいコンテナをビルドする
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  validate:
    name: 制御処理を検証
    uses: ./.github/workflows/validate.yml

  container:
    name: AWSでSquashFSを準備
    needs: validate
    if: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[cluster:genkai]') || contains(github.event.head_commit.message, '[cluster:aspire2ap]'))) || (github.event_name == 'workflow_dispatch' && (inputs.run_genkai || inputs.run_aspire2ap)) }}
    uses: ./.github/workflows/aws-container.yml
    with:
      require_build: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_build) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[require-build]')) }}
    secrets: inherit

  genkai:
    name: 玄界
    needs: [validate, container]
    if: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:genkai]')) || (github.event_name == 'workflow_dispatch' && inputs.run_genkai)) && needs.container.outputs.genkai_container_sha256 != '' && needs.container.outputs.genkai_container_size != '' }}
    uses: ./.github/workflows/genkai.yml
    with:
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:1]') && '1' || '2' }}
      profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[profile]')) }}
      container_sha256: ${{ needs.container.outputs.genkai_container_sha256 }}
      container_size: ${{ needs.container.outputs.genkai_container_size }}
    secrets: inherit

  aspire2ap:
    name: ASPIRE 2A+
    needs: [validate, container]
    if: ${{ !contains(github.event.head_commit.message, '[build-only]') && !contains(github.event.head_commit.message, '[cutlass-grid-probe]') && !contains(github.event.head_commit.message, '[moe-routing-probe]') && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:aspire2ap]')) || (github.event_name == 'workflow_dispatch' && inputs.run_aspire2ap)) && needs.container.outputs.aspire2ap_container_sha256 != '' && needs.container.outputs.aspire2ap_container_size != '' }}
    uses: ./.github/workflows/aspire2ap.yml
    with:
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:1]') && '1' || '2' }}
      profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[profile]')) }}
      container_sha256: ${{ needs.container.outputs.aspire2ap_container_sha256 }}
      container_size: ${{ needs.container.outputs.aspire2ap_container_size }}
    secrets: inherit

  cutlass-grid:
    name: ASPIRE 2A+の1GPU有限kernel probe
    needs: [validate, container]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:aspire2ap]') && (contains(github.event.head_commit.message, '[cutlass-grid-probe]') || contains(github.event.head_commit.message, '[moe-routing-probe]')) && !contains(github.event.head_commit.message, '[build-only]') && needs.container.outputs.aspire2ap_container_sha256 != '' && needs.container.outputs.aspire2ap_container_size != '' }}
    uses: ./.github/workflows/aspire2ap-grid.yml
    with:
      container_sha256: ${{ needs.container.outputs.aspire2ap_container_sha256 }}
      container_size: ${{ needs.container.outputs.aspire2ap_container_size }}
    secrets: inherit

  firmus:
    name: Firmus
    needs: validate
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:firmus]') && !contains(github.event.head_commit.message, '[dynamo]')) || (github.event_name == 'workflow_dispatch' && inputs.run_firmus) }}
    uses: ./.github/workflows/firmus.yml
    with:
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:1]') && '1' || '2' }}
      profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[profile]')) }}
      require_build: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_build) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[require-build]')) }}
    secrets: inherit

  firmus-dynamo:
    name: Firmus Dynamo
    needs: validate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:firmus]') && contains(github.event.head_commit.message, '[dynamo]') }}
    uses: ./.github/workflows/firmus-dynamo.yml
    secrets: inherit

  firmus-dynamo-recover:
    name: 既存Dynamoジョブの制限時間を修正して回収
    needs: validate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[firmus-dynamo-recover]') }}
    uses: ./.github/workflows/firmus.yml
    with:
      node_count: '2'
      profile: false
      require_build: false
      dynamo: true
      recovery_job_id: '21736'
      recovery_runtime_dir: /scratch/home/ACCOUNT/qwen/runs/dynamo-37726750730-1.9k8iOb5LLl
    secrets: inherit

  firmus-collect:
    name: Firmus既存22351の状態と成果物を回収
    needs: validate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[firmus-collect]') }}
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 15
    env:
      SLURM_JOB_ID: '22351'
      RUNTIME_DIR: /scratch/home/ACCOUNT/qwen/runs/pd-38039229663-1.dQNNKAwou6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 既存ジョブを変更せず状態とファイルを読み取る
        shell: home-lab-shell {0}
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/qwen-firmus-existing"
          install -d -m 0755 "${destination}/snapshot"
          state=$(timeout --foreground 180 firmus-shell "scontrol show job -o ${SLURM_JOB_ID}")
          printf '%s\n' "${state}" >"${destination}/snapshot/slurm-job.txt"
          [[ " ${state} " == *" JobId=${SLURM_JOB_ID} "* && " ${state} " == *" WorkDir=${RUNTIME_DIR} "* ]] || { echo 'Job ID or runtime mismatch; refusing collection.' >&2; exit 1; }
          timeout --foreground 180 firmus-shell "squeue --noheader --jobs=${SLURM_JOB_ID} --format='%i %T %M %l %R'" >"${destination}/snapshot/squeue.txt"
          timeout --foreground 180 firmus-shell "sacct --allocations --jobs=${SLURM_JOB_ID} --noheader --parsable2 --format=JobID,State,ExitCode,Elapsed,AllocNodes" >"${destination}/snapshot/sacct.txt"
          timeout --foreground 180 firmus-shell 'scontrol show partition -o hpcai' >"${destination}/snapshot/partition.txt"
          for part in logs profile results source; do timeout --foreground 180 firmus-shell --pull "${RUNTIME_DIR}/${part}" "${destination}/${part}"; done
          printf 'origin_run=38039229663\norigin_attempt=1\njob_id=%s\nruntime_dir=%s\ncollection_run=%s\njob_and_runtime_preserved=true\n' "${SLURM_JOB_ID}" "${RUNTIME_DIR}" "${GITHUB_RUN_ID}" >"${destination}/snapshot/collection.txt"

      - name: 回収成果物を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen-firmus-existing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-firmus-existing
          if-no-files-found: error

      - name: 回収状態をsummaryへ記録
        if: always()
        shell: bash
        run: |
          printf '### Existing Firmus job 22351\n\nRead-only collection from run 38039229663/1. No submission, scheduler update, cancellation, or runtime cleanup.\n\n' >>"${GITHUB_STEP_SUMMARY}"
          if [[ -s "${RUNNER_TEMP}/qwen-firmus-existing/snapshot/squeue.txt" ]]; then cat "${RUNNER_TEMP}/qwen-firmus-existing/snapshot/squeue.txt" >>"${GITHUB_STEP_SUMMARY}"; fi

  archive-artifacts:
    name: 成果物を自宅サーバーへ保管
    needs: [genkai, aspire2ap, firmus, firmus-dynamo, firmus-dynamo-recover, cutlass-grid, firmus-collect]
    if: >-
      always() &&
      (needs.genkai.result != 'skipped' || needs.aspire2ap.result != 'skipped' || needs.firmus.result != 'skipped' || needs.firmus-dynamo.result != 'skipped' || needs.firmus-dynamo-recover.result != 'skipped' || needs.cutlass-grid.result != 'skipped' || needs.firmus-collect.result != 'skipped')
    runs-on: [self-hosted, home-lab]
    permissions:
      actions: write
      contents: read
    env:
      QWEN_ARTIFACT_ARCHIVE_ROOT: /srv/qwen-artifacts

    steps:
      - name: ワークフロー成果物を取得
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: qwen-*-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 保管対象の有無を確認
        id: artifacts
        shell: bash
        run: if [[ -n "$(find artifacts -type f -print -quit 2>/dev/null)" ]]; then printf 'present=true\n' >>"${GITHUB_OUTPUT}"; else printf 'present=false\n' >>"${GITHUB_OUTPUT}"; fi

      - name: 成果物を自宅サーバーへ配置
        id: archive
        if: steps.artifacts.outputs.present == 'true'
        shell: home-lab-shell {0}
        run: |
          destination_parent="${QWEN_ARTIFACT_ARCHIVE_ROOT}/${GITHUB_RUN_ID}"
          destination="${destination_parent}/${GITHUB_RUN_ATTEMPT}"
          test -d artifacts
          test -n "$(find artifacts -type f -print -quit)"
          install -d -m 0750 "${destination_parent}"
          staging="$(mktemp -d "${destination_parent}/.${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          trap 'rm -rf -- "${staging}"' EXIT
          cp -a artifacts/. "${staging}/"
          (cd "${staging}" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS)
          mv -T -- "${staging}" "${destination}"
          trap - EXIT

      - name: 保管先をsummaryに記録
        if: always() && steps.archive.outcome == 'success'
        shell: bash
        run: printf '### Artifact archive\n\nArchived and checksummed at **archive-host:/srv/qwen-artifacts/%s/%s/**.\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_STEP_SUMMARY}"

      - name: 転送済みのGitHub成果物を削除
        if: steps.artifacts.outputs.present == 'true'
        shell: home-lab-shell {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("qwen-") and endswith("-${{ github.run_id }}-${{ github.run_attempt }}")) | .id' | while read -r artifact_id; do gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"; done
