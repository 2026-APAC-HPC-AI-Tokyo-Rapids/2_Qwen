name: Qwen

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "research/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      run_genkai:
        description: 玄界で実行する
        required: true
        default: false
        type: boolean
      run_aspire2ap:
        description: ASPIRE 2A+で実行する
        required: true
        default: false
        type: boolean
      run_firmus:
        description: Firmusで実行する
        required: true
        default: true
        type: boolean
      node_count:
        description: 実行ノード数
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
      profile:
        description: 通常計測の代わりにプロファイルを取得する
        required: true
        default: false
        type: boolean
      require_build:
        description: 既存成果物を再利用せず新しいコンテナをビルドする
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  validate:
    name: 制御処理を検証
    uses: ./.github/workflows/validate.yml

  container:
    name: AWSでSquashFSを準備
    needs: validate
    if: ${{ !contains(github.event.head_commit.message, '[basic]') && ((github.event_name == 'push' && (contains(github.event.head_commit.message, '[cluster:genkai]') || (contains(github.event.head_commit.message, '[cluster:aspire2ap]') && !contains(github.event.head_commit.message, '[kernel-bench]')) || (contains(github.event.head_commit.message, '[cluster:firmus]') && !contains(github.event.head_commit.message, '[dynamo]') && !contains(github.event.head_commit.message, '[kernel-bench]')))) || (github.event_name == 'workflow_dispatch' && (inputs.run_genkai || inputs.run_aspire2ap || inputs.run_firmus)) ) }}
    uses: ./.github/workflows/aws-container.yml
    with:
      require_build: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_build) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[require-build]')) }}
      firmus_only_build: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:firmus]') && !contains(github.event.head_commit.message, '[cluster:genkai]') && !contains(github.event.head_commit.message, '[cluster:aspire2ap]') }}
      firmus_config: ${{ contains(github.event.head_commit.message, '[prefill-pp4]') && 'configs/firmus-prefill-pp4.json' || '' }}
    secrets: inherit

  genkai:
    name: 玄界
    needs: [validate, container]
    if: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:genkai]')) || (github.event_name == 'workflow_dispatch' && inputs.run_genkai)) && needs.container.outputs.genkai_container_sha256 != '' && needs.container.outputs.genkai_container_size != '' }}
    uses: ./.github/workflows/genkai.yml
    with:
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:1]') && '1' || '2' }}
      profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[profile]')) }}
      container_sha256: ${{ needs.container.outputs.genkai_container_sha256 }}
      container_size: ${{ needs.container.outputs.genkai_container_size }}
    secrets: inherit

  aspire2ap:
    name: ASPIRE 2A+
    needs: [validate, container]
    if: ${{ !contains(github.event.head_commit.message, '[build-only]') && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:aspire2ap]') && !contains(github.event.head_commit.message, '[kernel-bench]')) || (github.event_name == 'workflow_dispatch' && inputs.run_aspire2ap)) && needs.container.outputs.aspire2ap_container_sha256 != '' && needs.container.outputs.aspire2ap_container_size != '' }}
    uses: ./.github/workflows/aspire2ap.yml
    with:
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:1]') && '1' || '2' }}
      profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[profile]')) }}
      container_sha256: ${{ needs.container.outputs.aspire2ap_container_sha256 }}
      container_size: ${{ needs.container.outputs.aspire2ap_container_size }}
    secrets: inherit

  firmus:
    name: Firmus
    needs: [validate, container]
    if: ${{ !contains(github.event.head_commit.message, '[build-only]') && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:firmus]') && !contains(github.event.head_commit.message, '[dynamo]') && !contains(github.event.head_commit.message, '[kernel-bench]')) || (github.event_name == 'workflow_dispatch' && inputs.run_firmus)) && needs.container.outputs.firmus_container_sha256 != '' && needs.container.outputs.firmus_container_size != '' }}
    uses: ./.github/workflows/firmus.yml
    with:
      config_path: ${{ contains(github.event.head_commit.message, '[prefill-pp4]') && 'configs/firmus-prefill-pp4.json' || 'configs/firmus-framework.json' }}
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:1]') && '1' || '2' }}
      profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[profile]')) }}
      require_build: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_build) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[require-build]')) }}
      container_sha256: ${{ needs.container.outputs.firmus_container_sha256 }}
      container_size: ${{ needs.container.outputs.firmus_container_size }}
    secrets: inherit

  firmus-dynamo:
    name: Firmus Dynamo
    needs: validate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:firmus]') && contains(github.event.head_commit.message, '[dynamo]') }}
    uses: ./.github/workflows/firmus-dynamo.yml
    secrets: inherit

  firmus-kernel-bench:
    name: Firmus MegaMoE kernel bench
    needs: validate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:firmus]') && contains(github.event.head_commit.message, '[kernel-bench]') }}
    uses: ./.github/workflows/firmus-kernel-bench.yml
    with:
      node_count: ${{ contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:1]') && '1' || '2' }}
    secrets: inherit

  aspire2ap-kernel-bench:
    name: ASPIRE MegaMoE kernel bench
    needs: validate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:aspire2ap]') && contains(github.event.head_commit.message, '[kernel-bench]') }}
    uses: ./.github/workflows/aspire-kernel-bench.yml
    with:
      node_count: ${{ contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:1]') && '1' || '2' }}
    secrets: inherit

  archive-artifacts:
    name: 成果物を自宅サーバーへ保管
    needs: [genkai, aspire2ap, firmus, firmus-dynamo, firmus-kernel-bench, aspire2ap-kernel-bench]
    if: >-
      always() &&
      (needs.genkai.result != 'skipped' || needs.aspire2ap.result != 'skipped' || needs.firmus.result != 'skipped' || needs.firmus-dynamo.result != 'skipped' || needs.firmus-kernel-bench.result != 'skipped' || needs.aspire2ap-kernel-bench.result != 'skipped')
    runs-on: [self-hosted, home-lab]
    permissions:
      actions: write
      contents: read
    env:
      QWEN_ARTIFACT_ARCHIVE_ROOT: /srv/qwen-artifacts

    steps:
      - name: ワークフロー成果物を取得
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: qwen-*-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 保管対象の有無を確認
        id: artifacts
        shell: bash
        run: if [[ -n "$(find artifacts -type f -print -quit 2>/dev/null)" ]]; then printf 'present=true\n' >>"${GITHUB_OUTPUT}"; else printf 'present=false\n' >>"${GITHUB_OUTPUT}"; fi

      - name: 成果物を自宅サーバーへ配置
        id: archive
        if: steps.artifacts.outputs.present == 'true'
        shell: home-lab-shell {0}
        run: |
          destination_parent="${QWEN_ARTIFACT_ARCHIVE_ROOT}/${GITHUB_RUN_ID}"
          destination="${destination_parent}/${GITHUB_RUN_ATTEMPT}"
          test -d artifacts
          test -n "$(find artifacts -type f -print -quit)"
          install -d -m 0750 "${destination_parent}"
          staging="$(mktemp -d "${destination_parent}/.${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          trap 'rm -rf -- "${staging}"' EXIT
          cp -a artifacts/. "${staging}/"
          (cd "${staging}" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS)
          mv -T -- "${staging}" "${destination}"
          trap - EXIT

      - name: 保管先をsummaryに記録
        if: always() && steps.archive.outcome == 'success'
        shell: bash
        run: printf '### Artifact archive\n\nArchived and checksummed at **archive-host:/srv/qwen-artifacts/%s/%s/**.\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_STEP_SUMMARY}"

      - name: 転送済みのGitHub成果物を削除
        if: steps.artifacts.outputs.present == 'true'
        shell: home-lab-shell {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("qwen-") and endswith("-${{ github.run_id }}-${{ github.run_attempt }}")) | .id' | while read -r artifact_id; do gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"; done
