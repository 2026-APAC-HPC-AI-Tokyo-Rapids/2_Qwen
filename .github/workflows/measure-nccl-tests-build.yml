name: Measure nccl-tests build time

on:
  workflow_dispatch:
    inputs:
      sif_run_number:
        description: Workflow run number whose existing SGLang SIF supplies CUDA, NCCL, and OpenMPI
        required: true
        default: '117'
        type: string

permissions:
  contents: read

env:
  SIF_ARCHIVE_DIR: /home/ACCOUNT/share/sglang-sifs

defaults:
  run:
    shell: bash --login -eo pipefail {0}

jobs:
  measure:
    name: Clean build sample ${{ matrix.sample }}
    runs-on: [self-hosted, genkai]
    timeout-minutes: 7200

    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]

    env:
      MEASURE_DIR: /dev/shm/nccl-tests-measure/run-${{ github.run_id }}-${{ github.run_attempt }}-sample-${{ matrix.sample }}

    steps:
      - name: Check measurement inputs
        run: |
          [[ '${{ inputs.sif_run_number }}' =~ ^[0-9]+$ ]]
          test -s "${SIF_ARCHIVE_DIR}/${{ inputs.sif_run_number }}.sif"
          module load singularity-ce/4.1.3
          singularity --version

      - name: Clone nccl-tests master and measure a clean build
        run: |
          module load singularity-ce/4.1.3
          install -d -m 2775 "${MEASURE_DIR}/logs"
          sif_path="${SIF_ARCHIVE_DIR}/${{ inputs.sif_run_number }}.sif"

          clone_start_ns="$(date +%s%N)"
          git clone --depth=1 --branch master https://github.com/NVIDIA/nccl-tests.git "${MEASURE_DIR}/source"
          clone_end_ns="$(date +%s%N)"
          source_commit="$(git -C "${MEASURE_DIR}/source" rev-parse HEAD)"

          build_start_ns="$(date +%s%N)"
          singularity exec \
            --cleanenv \
            --writable-tmpfs \
            --bind "${MEASURE_DIR}:${MEASURE_DIR}" \
            "${sif_path}" \
            make -C "${MEASURE_DIR}/source" \
              -j 40 \
              CC=/usr/bin/gcc \
              CXX=/usr/bin/g++ \
              MPI=1 \
              MPI_HOME=/usr/lib/x86_64-linux-gnu/openmpi \
              NVCC_GENCODE='-gencode=arch=compute_90,code=sm_90' \
              2>&1 | tee "${MEASURE_DIR}/logs/build.log"
          build_end_ns="$(date +%s%N)"

          clone_ms="$(( (clone_end_ns - clone_start_ns) / 1000000 ))"
          build_ms="$(( (build_end_ns - build_start_ns) / 1000000 ))"
          binary_count="$(find "${MEASURE_DIR}/source/build" -maxdepth 1 -type f -name '*_perf' | wc -l)"
          test "${binary_count}" -eq 11

          jq -n \
            --argjson sample '${{ matrix.sample }}' \
            --arg sif_run_number '${{ inputs.sif_run_number }}' \
            --arg source_ref master \
            --arg source_commit "${source_commit}" \
            --arg cuda_arch sm_90 \
            --argjson parallel_jobs 40 \
            --argjson clone_ms "${clone_ms}" \
            --argjson build_ms "${build_ms}" \
            --argjson binary_count "${binary_count}" \
            '{sample: $sample, sif_run_number: $sif_run_number, source_ref: $source_ref, source_commit: $source_commit, cuda_arch: $cuda_arch, parallel_jobs: $parallel_jobs, clone_ms: $clone_ms, build_ms: $build_ms, binary_count: $binary_count}' \
            | tee "${MEASURE_DIR}/logs/result.json"

      - name: Upload measurement logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nccl-tests-build-sample-${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MEASURE_DIR }}/logs
          compression-level: 1

      - name: Cleanup measurement directory
        if: always()
        run: |
          : "${MEASURE_DIR:?}"
          [[ "${MEASURE_DIR}" == /dev/shm/nccl-tests-measure/run-* ]]
          rm -rf -- "${MEASURE_DIR}"
