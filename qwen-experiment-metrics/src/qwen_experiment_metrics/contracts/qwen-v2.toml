schema_version = "qwen-metrics-registry/v1"

[[producers]]
id = "runner"
instance_pattern = "^runner$"
applicability = ["bench", "profile"]
required = true

[[producers]]
id = "stage"
instance_pattern = "^stage:[a-z0-9][a-z0-9._-]{0,99}$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "configuration"
instance_pattern = "^configuration:node-[0-9]+$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "result"
instance_pattern = "^result$"
applicability = ["bench", "profile"]
required = true

[[producers]]
id = "gpu-sampler"
instance_pattern = "^gpu-sampler:node-[0-9]+$"
applicability = ["profile"]
required = false

[[producers]]
id = "provenance"
instance_pattern = "^provenance$"
applicability = ["bench", "profile"]
required = true

[[producers]]
id = "environment"
instance_pattern = "^environment:runtime$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "runtime-launchers"
instance_pattern = "^runtime-launchers$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "run-lifecycle"
instance_pattern = "^run-lifecycle$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "hardware"
instance_pattern = "^hardware:node-[0-9]+$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "topology"
instance_pattern = "^topology:node-[0-9]+$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "workload"
instance_pattern = "^workload:(?:warmup|measured)$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "worker"
instance_pattern = "^worker:global-rank-[0-9]+$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "node-lifecycle"
instance_pattern = "^node-lifecycle:node-[0-9]+$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "lifecycle-control"
instance_pattern = "^lifecycle-control$"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "run_id"
key_pattern = "^run\\.identity\\.run_id$"
owner = "runner"
logical_type = "string"
unit = "none"
cardinality = "one per run"
authoritative_source = "control/run-manifest.json run_id"
capture_moment = "before submission"
raw_destination = "run/key/value fact"
validation = "must equal the persisted manifest run_id"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "run_purpose"
key_pattern = "^run\\.identity\\.run_purpose$"
owner = "runner"
logical_type = "string"
unit = "none"
cardinality = "one per run"
authoritative_source = "control/run-manifest.json run_purpose"
capture_moment = "before submission"
raw_destination = "run/key/value fact"
validation = "enum bench or profile and equal to manifest"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "repository_id"
key_pattern = "^run\\.identity\\.repository_id$"
owner = "runner"
logical_type = "string"
unit = "none"
cardinality = "one per run"
authoritative_source = "control/run-manifest.json repository_id"
capture_moment = "before submission"
raw_destination = "run/key/value fact"
validation = "must equal apac2026-qwen"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "source_track_head"
key_pattern = "^source\\.track\\.head_commit$"
owner = "runner"
logical_type = "string"
unit = "none"
cardinality = "one per run"
authoritative_source = "control/run-manifest.json source_track.head_commit"
capture_moment = "before submission"
raw_destination = "run/key/value fact"
validation = "full Git OID equal to the persisted source track"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "scheduler_request_uint"
key_pattern = "^scheduler\\.request\\.(?:nodes|mpi_processes|gpus_per_node|tensor_parallel_size|sglang_port|node_agent_port|rendezvous_timeout_sec|ready_timeout_sec)$"
owner = "runner"
logical_type = "uint"
unit = "count, port, or second as named"
cardinality = "eight independent fields per run"
authoritative_source = "control/execution-settings.json"
capture_moment = "before submission"
raw_destination = "run/key/value fact"
validation = "closed settings and multiplicatively consistent process/GPU grid"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "scheduler_request_string"
key_pattern = "^scheduler\\.request\\.(?:resource_group|transport_policy|advertise_source)$"
owner = "runner"
logical_type = "string"
unit = "none"
cardinality = "three independent fields per run"
authoritative_source = "control/execution-settings.json"
capture_moment = "before submission"
raw_destination = "run/key/value fact"
validation = "nonempty execution setting"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "build_provenance"
key_pattern = "^build\\.provenance$"
owner = "provenance"
logical_type = "jcs"
unit = "none"
cardinality = "one per run"
authoritative_source = "validated container sidecar and selected SquashFS archive"
capture_moment = "after provision validation"
raw_destination = "run/key/value fact"
validation = "SquashFS bytes, OCI manifest identity, and Buildah/Skopeo/Umoci toolchain"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "model_input"
key_pattern = "^input\\.model$"
owner = "provenance"
logical_type = "jcs"
unit = "none"
cardinality = "one per run"
authoritative_source = "source/model-metadata.json"
capture_moment = "after provision validation"
raw_destination = "run/key/value fact"
validation = "validated repository revision, dummy load format, and absent weights"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "dataset_input"
key_pattern = "^input\\.dataset$"
owner = "provenance"
logical_type = "jcs"
unit = "none"
cardinality = "one per run"
authoritative_source = "source/dataset-manifest.json"
capture_moment = "after provision validation"
raw_destination = "run/key/value fact"
validation = "closed random-dataset parameters used by the dummy run"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "qwen_container_build_commit"
key_pattern = "^source\\.container_build\\.qwen_commit$"
owner = "provenance"
logical_type = "string"
unit = "none"
cardinality = "one per run"
authoritative_source = "source/container-sidecar.json source_commits qwen"
capture_moment = "after provision validation"
raw_destination = "run/key/value fact"
validation = "algorithm-constrained full Git OID"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "sglang_commit"
key_pattern = "^source\\.sglang\\.commit$"
owner = "provenance"
logical_type = "string"
unit = "none"
cardinality = "one per run"
authoritative_source = "source/container-sidecar.json source_commits sglang"
capture_moment = "after provision validation"
raw_destination = "run/key/value fact"
validation = "algorithm-constrained full Git OID"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "stage_launch"
key_pattern = "^run\\.stage\\.[a-z0-9][a-z0-9._-]{0,99}\\.launch$"
owner = "stage"
logical_type = "jcs"
unit = "none"
cardinality = "one per stage invocation"
authoritative_source = "StageRunner subprocess boundary"
capture_moment = "immediately before spawn"
raw_destination = "run/key/value fact"
validation = "closed argv/cwd/stderr_mode object"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "stage_termination"
key_pattern = "^run\\.stage\\.[a-z0-9][a-z0-9._-]{0,99}\\.termination$"
owner = "stage"
logical_type = "jcs"
unit = "none"
cardinality = "one per stage invocation"
authoritative_source = "StageRunner child wait outcome"
capture_moment = "after spawn failure or child terminal state"
raw_destination = "run/key/value fact"
validation = "closed exit, signal, or spawn_error union"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "stage_wall"
key_pattern = "^perf\\.stage\\.[a-z0-9][a-z0-9._-]{0,99}\\.wall_time_sec$"
owner = "stage"
logical_type = "decimal"
unit = "second"
cardinality = "one per stage invocation"
authoritative_source = "StageRunner monotonic clock"
capture_moment = "spawn boundary through terminal wait"
raw_destination = "run/key/value fact"
validation = "finite nonnegative elapsed seconds"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "bench_args_effective"
key_pattern = "^sglang\\.node\\.[0-9]+\\.bench_args_effective\\.(?:[A-Za-z0-9_-]+|encoded\\.[0-9a-f]+)$"
owner = "configuration"
logical_type = "jcs"
unit = "declared by SGLang field"
cardinality = "one per node and BenchArgs field"
authoritative_source = "SGLang config-snapshot/v1 domain event"
capture_moment = "after defaults and auto resolution"
raw_destination = "run/key/value fact"
validation = "closed event, sorted unique fields, source blob binding"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "server_args_effective"
key_pattern = "^sglang\\.node\\.[0-9]+\\.server_args_effective\\.(?:[A-Za-z0-9_-]+|encoded\\.[0-9a-f]+)$"
owner = "configuration"
logical_type = "jcs"
unit = "declared by SGLang field"
cardinality = "one per node and ServerArgs field"
authoritative_source = "SGLang config-snapshot/v1 domain event"
capture_moment = "after defaults and auto resolution"
raw_destination = "run/key/value fact"
validation = "closed event, sorted unique fields, source blob binding"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "generation_wall"
key_pattern = "^perf\\.benchmark\\.generation\\.wall_time_sec$"
owner = "result"
logical_type = "decimal"
unit = "second"
cardinality = "one per primary result"
authoritative_source = "source/primary-result.json"
capture_moment = "immediately after generate returns"
raw_destination = "run/key/value fact"
validation = "positive finite decimal"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "returned_count"
key_pattern = "^result\\.request\\.returned_count$"
owner = "result"
logical_type = "uint"
unit = "request"
cardinality = "one per primary result"
authoritative_source = "validated primary-result/v1"
capture_moment = "immediately after response validation"
raw_destination = "run/key/value fact"
validation = "nonnegative integer"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "error_count"
key_pattern = "^result\\.request\\.error_count$"
owner = "result"
logical_type = "uint"
unit = "request"
cardinality = "one per primary result"
authoritative_source = "validated primary-result/v1"
capture_moment = "immediately after response validation"
raw_destination = "run/key/value fact"
validation = "nonnegative integer"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "observed_input_tokens"
key_pattern = "^result\\.token\\.input\\.total$"
owner = "result"
logical_type = "uint"
unit = "token"
cardinality = "zero or one per primary result"
authoritative_source = "validated primary-result/v1"
capture_moment = "immediately after response validation"
raw_destination = "run/key/value fact"
validation = "absent when source field is null"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "observed_output_tokens"
key_pattern = "^result\\.token\\.output\\.total$"
owner = "result"
logical_type = "uint"
unit = "token"
cardinality = "zero or one per primary result"
authoritative_source = "validated primary-result/v1"
capture_moment = "immediately after response validation"
raw_destination = "run/key/value fact"
validation = "absent when source field is null"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "ordered_output_identity"
key_pattern = "^result\\.token\\.output\\.ordered_token_ids_sha256$"
owner = "result"
logical_type = "sha256"
unit = "none"
cardinality = "zero or one per primary result"
authoritative_source = "validated primary-result/v1"
capture_moment = "immediately after response validation"
raw_destination = "run/key/value fact"
validation = "absent unless all ordered output token ids validate"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "environment_value_base64"
key_pattern = '^environment\.runtime\.(?:[A-Za-z0-9_-]+|encoded\.[0-9a-f]+)$'
owner = "environment"
logical_type = "string"
unit = "RFC4648 base64"
cardinality = "one per environment name at common runtime"
authoritative_source = "name-NUL-value-NUL environment snapshot"
capture_moment = "at the named execution scope boundary"
raw_destination = "source/environment/<scope>.snapshot"
validation = "byte-sorted unique names and NUL-terminated pairs"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "runtime_launchers"
key_pattern = "^runtime\\.launchers$"
owner = "runtime-launchers"
logical_type = "jcs"
unit = "none"
cardinality = "one per run"
authoritative_source = "source/runtime-launchers.json and version command outputs"
capture_moment = "after runtime modules are loaded"
raw_destination = "run/key/value fact"
validation = "resolved executable hashes and successful version commands"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "run_lifecycle_timestamp"
key_pattern = '^run\.(?:started_at|finished_at)$'
owner = "run-lifecycle"
logical_type = "string"
unit = "RFC3339 UTC"
cardinality = "two per run"
authoritative_source = "source/run-lifecycle.json"
capture_moment = "PJM job entry and exit"
raw_destination = "run/key/value fact"
validation = "closed lifecycle and ordered wall timestamps"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "run_lifecycle_elapsed"
key_pattern = '^run\.elapsed_sec$'
owner = "run-lifecycle"
logical_type = "decimal"
unit = "second"
cardinality = "one per run"
authoritative_source = "source/run-lifecycle.json monotonic timestamps"
capture_moment = "PJM job exit"
raw_destination = "run/key/value fact"
validation = "exact monotonic difference"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "run_lifecycle_exit"
key_pattern = '^run\.exit_code$'
owner = "run-lifecycle"
logical_type = "int"
unit = "exit status"
cardinality = "one per run"
authoritative_source = "source/run-lifecycle.json"
capture_moment = "PJM job exit"
raw_destination = "run/key/value fact"
validation = "integer exit code"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "hardware_hostname"
key_pattern = '^hardware\.node\.[0-9]+\.hostname$'
owner = "hardware"
logical_type = "string"
unit = "none"
cardinality = "one per expected node"
authoritative_source = "source/hardware/node-<node>.json"
capture_moment = "node wrapper entry"
raw_destination = "run/key/value fact"
validation = "nonempty gethostname value"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "hardware_string"
key_pattern = '^hardware\.node\.[0-9]+\.(?:kernel\.release|cpu_boost\.(?:source_path|raw)|cpufreq_policy\.[0-9]+\.(?:driver|governor))$'
owner = "hardware"
logical_type = "string"
unit = "none"
cardinality = "zero or more per node"
authoritative_source = "closed platform_settings source"
capture_moment = "node wrapper entry"
raw_destination = "run/key/value fact"
validation = "validated nonempty source value"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "hardware_cpu_identity"
key_pattern = '^hardware\.node\.[0-9]+\.cpu\.(?:architecture|model_name|vendor_id|cpu_family|model|stepping)$'
owner = "hardware"
logical_type = "string"
unit = "none"
cardinality = "zero through six per node"
authoritative_source = "source/hardware/node-<node>.json lscpu_json"
capture_moment = "minimal hardware projection"
raw_destination = "run/key/value fact"
validation = "exact lscpu labels with one trailing colon removed"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "hardware_cpu_counts"
key_pattern = '^hardware\.node\.[0-9]+\.cpu\.(?:physical_cores|numa_nodes)$'
owner = "hardware"
logical_type = "uint"
unit = "count"
cardinality = "zero through two per node"
authoritative_source = "source/hardware/node-<node>.json lscpu_json"
capture_moment = "minimal hardware projection"
raw_destination = "run/key/value fact"
validation = "strict uint; physical cores is sockets times cores per socket"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "hardware_array"
key_pattern = '^hardware\.node\.[0-9]+\.(?:cpu\.(?:online|isolated|nohz_full)|cpufreq_policy\.[0-9]+\.related_cpus)$'
owner = "hardware"
logical_type = "jcs"
unit = "CPU index array"
cardinality = "zero or more per node"
authoritative_source = "closed platform_settings source"
capture_moment = "node wrapper entry"
raw_destination = "run/key/value fact"
validation = "sorted unique uint array"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "hardware_bool"
key_pattern = '^hardware\.node\.[0-9]+\.(?:numa_balancing_enabled|cpu_boost\.enabled)$'
owner = "hardware"
logical_type = "bool"
unit = "none"
cardinality = "zero through two per node"
authoritative_source = "closed platform_settings source"
capture_moment = "node wrapper entry"
raw_destination = "run/key/value fact"
validation = "strict bool"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "hardware_uint"
key_pattern = '^hardware\.node\.[0-9]+\.(?:memory\.(?:total_bytes|hugepage_size_bytes|hugepages_total)|cpufreq_policy\.[0-9]+\.(?:min_hz|max_hz))$'
owner = "hardware"
logical_type = "uint"
unit = "byte, count, or hertz as named"
cardinality = "zero or more per node"
authoritative_source = "closed platform_settings source"
capture_moment = "node wrapper entry"
raw_destination = "run/key/value fact"
validation = "nonnegative integer"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "topology_outer_uint"
key_pattern = '^parallel\.node\.[0-9]+\.(?:global_rank|local_rank|size)$'
owner = "topology"
logical_type = "uint"
unit = "rank or process count"
cardinality = "three per expected node"
authoritative_source = "source/topology/node-<node>.json outer_mpi"
capture_moment = "outer MPI node wrapper entry"
raw_destination = "run/key/value fact"
validation = "closed node topology"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "topology_outer_string"
key_pattern = '^parallel\.node\.[0-9]+\.(?:hostname|numa_mems)$'
owner = "topology"
logical_type = "string"
unit = "none"
cardinality = "one or two per expected node"
authoritative_source = "source/topology/node-<node>.json"
capture_moment = "outer MPI node wrapper entry"
raw_destination = "run/key/value fact"
validation = "nonempty source string"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "topology_outer_array"
key_pattern = '^parallel\.node\.[0-9]+\.(?:node_wrapper_argv|container_argv|sglang_argv|cpu_affinity)$'
owner = "topology"
logical_type = "jcs"
unit = "none"
cardinality = "four per expected node"
authoritative_source = "source/topology/node-<node>.json"
capture_moment = "outer MPI node wrapper entry"
raw_destination = "run/key/value fact"
validation = "actual argv or CPU affinity array"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "topology_gpu_string"
key_pattern = '^hardware\.node\.[0-9]+\.gpu\.[0-9]+\.(?:name|uuid|pci_bus_id|driver_version|persistence_mode|compute_mode|mig_mode|ecc_mode|scope)$'
owner = "topology"
logical_type = "string"
unit = "none"
cardinality = "zero or more per expected GPU"
authoritative_source = "sealed container nvidia-smi stdout"
capture_moment = "before SGLang launch"
raw_destination = "run/key/value fact"
validation = "strict CSV reducer"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "topology_gpu_memory"
key_pattern = '^hardware\.node\.[0-9]+\.gpu\.[0-9]+\.memory\.total_bytes$'
owner = "topology"
logical_type = "uint"
unit = "byte"
cardinality = "zero or one per expected GPU"
authoritative_source = "sealed container nvidia-smi stdout"
capture_moment = "before SGLang launch"
raw_destination = "run/key/value fact"
validation = "integral MiB to bytes conversion"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "topology_gpu_index"
key_pattern = '^hardware\.node\.[0-9]+\.gpu\.[0-9]+\.index$'
owner = "topology"
logical_type = "uint"
unit = "logical GPU index"
cardinality = "one per expected GPU"
authoritative_source = "sealed container nvidia-smi stdout"
capture_moment = "before SGLang launch"
raw_destination = "run/key/value fact"
validation = "path index and value are identical"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "topology_gpu_decimal"
key_pattern = '^hardware\.node\.[0-9]+\.gpu\.[0-9]+\.(?:power_limit_watt|clock\.(?:sm_max_mhz|memory_max_mhz))$'
owner = "topology"
logical_type = "decimal"
unit = "watt or megahertz as named"
cardinality = "zero through three per expected GPU"
authoritative_source = "sealed container nvidia-smi stdout"
capture_moment = "before SGLang launch"
raw_destination = "run/key/value fact"
validation = "finite decimal or omitted for N/A"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "workload_manifest_sha256"
key_pattern = '^workload\.(?:warmup|measured)\.manifest_sha256$'
owner = "workload"
logical_type = "sha256"
unit = "none"
cardinality = "one per workload kind"
authoritative_source = "source/workload-<kind>.json"
capture_moment = "immediately before corresponding generate call"
raw_destination = "run/key/value fact"
validation = "SHA-256 of closed canonical ordered workload"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "worker_ready_uint"
key_pattern = '^parallel\.worker\.[0-9]+\.(?:node_rank|tp_rank|gpu_id)$'
owner = "worker"
logical_type = "uint"
unit = "rank or logical GPU index"
