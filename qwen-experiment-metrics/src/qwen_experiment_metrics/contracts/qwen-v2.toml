applicability = ["bench", "profile"]
required = false

[[facts]]
id = "run_id"
key_pattern = "^run\\.identity\\.run_id$"
owner = "runner"
logical_type = "string"
unit = "none"
cardinality = "one per run"
authoritative_source = "control/run-manifest.json run_id"
capture_moment = "before submission"
raw_destination = "run/key/value fact"
validation = "must equal the persisted manifest run_id"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "run_purpose"
key_pattern = "^run\\.identity\\.run_purpose$"
owner = "runner"
logical_type = "string"
unit = "none"
cardinality = "one per run"
authoritative_source = "control/run-manifest.json run_purpose"
capture_moment = "before submission"
raw_destination = "run/key/value fact"
validation = "enum bench or profile and equal to manifest"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "instrumentation_bundle_sha256"
key_pattern = "^run\\.identity\\.instrumentation_bundle_sha256$"
