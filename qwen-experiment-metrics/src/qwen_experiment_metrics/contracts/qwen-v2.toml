capture_moment = "worker initialization complete"
raw_destination = "run/key/value fact"
validation = "closed worker event and envelope axis"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "worker_ready_string"
key_pattern = '^parallel\.worker\.[0-9]+\.(?:gpu_uuid|numa_mems|attention\.(?:prefill_backend|decode_backend)|torch_distributed_backend|transport_backend)$'
owner = "worker"
logical_type = "string"
unit = "none"
cardinality = "six per expected global rank"
authoritative_source = "worker_ready event"
capture_moment = "worker initialization complete"
raw_destination = "run/key/value fact"
validation = "nonempty actual worker value"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "worker_ready_affinity"
key_pattern = '^parallel\.worker\.[0-9]+\.cpu_affinity$'
owner = "worker"
logical_type = "jcs"
unit = "CPU index array"
cardinality = "one per expected global rank"
authoritative_source = "worker_ready event"
capture_moment = "worker initialization complete"
raw_destination = "run/key/value fact"
validation = "sorted unique uint array"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "node_process_clock_kind"
key_pattern = '^parallel\.node\.[0-9]+\.process\.(?:clock_id|termination\.kind)$'
owner = "node-lifecycle"
logical_type = "string"
unit = "none"
cardinality = "two per expected node"
authoritative_source = "source/lifecycle/node-<node>.json"
capture_moment = "node child wait boundary"
raw_destination = "run/key/value fact"
validation = "closed node-lifecycle/v1"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "node_process_uint"
key_pattern = '^parallel\.node\.[0-9]+\.process\.(?:spawn_attempt_ns|child_started_ns|child_finished_ns|termination\.raw_wait_status)$'
owner = "node-lifecycle"
logical_type = "uint"
unit = "monotonic nanosecond or raw POSIX wait status"
cardinality = "one through four per expected node"
authoritative_source = "source/lifecycle/node-<node>.json"
capture_moment = "node child wait boundary"
raw_destination = "run/key/value fact"
validation = "ordered timestamps and terminal raw wait status"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "lifecycle_rendezvous_string"
key_pattern = '^lifecycle\.rendezvous\.(?:rank0_hostname|address|created_at)$'
owner = "lifecycle-control"
logical_type = "string"
unit = "none"
cardinality = "three per run"
authoritative_source = "control/lifecycle/rendezvous.json"
capture_moment = "node-agent coordinator bind"
raw_destination = "run/key/value fact"
validation = "closed rendezvous identity"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "lifecycle_rendezvous_port"
key_pattern = '^lifecycle\.rendezvous\.port$'
owner = "lifecycle-control"
logical_type = "uint"
unit = "TCP port"
cardinality = "one per run"
authoritative_source = "control/lifecycle/rendezvous.json"
capture_moment = "node-agent coordinator bind"
raw_destination = "run/key/value fact"
validation = "execution-settings node-agent port"
applicability = ["bench", "profile"]
required = true

[[facts]]
id = "lifecycle_mark_string"
key_pattern = '^lifecycle\.node\.[0-9]+\.(?:ready|shutdown)\.(?:clock_id|invocation_id)$'
owner = "lifecycle-control"
logical_type = "string"
unit = "none"
cardinality = "one or two per lifecycle mark"
authoritative_source = "control/lifecycle/summary.json"
capture_moment = "node-agent ready or shutdown ACK"
raw_destination = "run/key/value fact"
validation = "closed ordered lifecycle mark"
applicability = ["bench", "profile"]
required = false

[[facts]]
id = "lifecycle_mark_uint"
key_pattern = '^lifecycle\.node\.[0-9]+\.(?:ready|shutdown)\.(?:sequence|received_ns|ack_ns)$'
owner = "lifecycle-control"
logical_type = "uint"
unit = "sequence or monotonic nanosecond"
cardinality = "three per lifecycle mark"
authoritative_source = "control/lifecycle/summary.json"
capture_moment = "node-agent ready or shutdown ACK"
raw_destination = "run/key/value fact"
validation = "closed ordered lifecycle mark"
applicability = ["bench", "profile"]
required = true
