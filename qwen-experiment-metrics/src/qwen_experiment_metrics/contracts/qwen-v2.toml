schema_version = "qwen-metrics-registry/v1"

[[producers]]
id = "runner"
instance_pattern = "^runner$"
applicability = ["bench", "profile"]
required = true

[[producers]]
id = "stage"
instance_pattern = "^stage:[a-z0-9][a-z0-9._-]{0,99}$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "configuration"
instance_pattern = "^configuration:node-[0-9]+$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "result"
instance_pattern = "^result$"
applicability = ["bench", "profile"]
required = true

[[producers]]
id = "merge"
instance_pattern = "^merge$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "network"
instance_pattern = "^network$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "gpu-sampler"
instance_pattern = "^gpu-sampler:node-[0-9]+$"
applicability = ["profile"]
required = false

[[producers]]
id = "provenance"
instance_pattern = "^provenance$"
applicability = ["bench", "profile"]
required = true

[[producers]]
id = "cache"
instance_pattern = "^cache:node-[0-9]+$"
applicability = ["bench", "profile"]
required = false

[[producers]]
id = "submission-request"
