[project]
name = "qwen-experiment-metrics"
version = "2.0.0"
description = "Local-first experiment metrics core for Qwen and SGLang"
requires-python = ">=3.11"
dependencies = ["rfc8785>=0.1.4,<0.2"]

[project.scripts]
qwen-experiment-metrics = "qwen_experiment_metrics.cli:main"

[project.optional-dependencies]
publish = [
    "google-auth>=2.40.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_experiment_metrics"]

[tool.uv]
package = true

[tool.qwen-experiment-metrics.bigquery]
project = "apac-hpc-ai-tokyo-rapids-26"
dataset = "qwen_experiment_metrics"
table = "qwen_metrics"
location = "asia-northeast1"
